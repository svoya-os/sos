# SOS greeter — Hyprland configuration.  SPDX-License-Identifier: Apache-2.0
#
# Read through /usr/share/svoya/hypr/greeter.conf, which /usr/lib/svoya/greeter-session passes to
# Hyprland (`Hyprland --config …`) as the svoya-greeter user. The compositor has one client, the
# Quickshell greeter; when it exits after a login, Hyprland exits and greetd starts the session.
#
# Assumed Hyprland: 0.53.3 (Ubuntu 26.04 archive, hyprlang syntax); valid up to 0.56.x. Hyprland
# after 0.56 reads Lua only and needs a port of this file (see shell/CHECKLIST.md).

monitor = , preferred, auto, auto

env = XCURSOR_THEME,Adwaita
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24

input {
    kb_layout = us,ru
    kb_options = grp:alt_shift_toggle
    numlock_by_default = true
    touchpad {
        tap-to-click = true
    }
}

# greeter-session writes the keyboard chosen at install time to $XDG_RUNTIME_DIR/svoya-greeter/
# (hyprlang cannot expand $XDG_RUNTIME_DIR, so a glob finds it; /tmp when the variable is unset).
# hyprlang noerror true
source = /run/user/*/svoya-greeter/input.conf
source = /tmp/svoya-greeter/input.conf
# hyprlang noerror false

general {
    border_size = 0
    gaps_in = 0
    gaps_out = 0
}

decoration {
    rounding = 0
    blur {
        enabled = false
    }
    shadow {
        enabled = false
    }
}

animations {
    enabled = false
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    force_default_wallpaper = 0
    background_color = rgb(0c0d0f)
    mouse_move_enables_dpms = true
    key_press_enables_dpms = true
    # started as plain `Hyprland`, not through the start-hyprland watchdog
    disable_watchdog_warning = true
}

ecosystem {
    no_update_news = true
    no_donation_nag = true
}

layerrule = no_anim on, match:namespace ^(svoya-.*)$

# The greeter; when it quits (session chosen, or a crash) the compositor quits too, and greetd
# either starts the session or restarts the greeter.
exec-once = sh -c 'quickshell -p /usr/share/svoya/shell/greeter; hyprctl dispatch exit'
