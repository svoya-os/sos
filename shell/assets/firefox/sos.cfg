// SOS Firefox autoconfig. Firefox skips the first line of this file: keep it a comment.
// SPDX-License-Identifier: Apache-2.0
//
// With the SOS ASCII symbol layer on and covering the browser (the shell's ~/.config/svoya/shell.json:
// asciiStyle "auto" = with the Phosphor theme, "always" or "off"; asciiParts has "browser"; the theme
// from ~/.local/state/svoya/theme.json, written by `sos theme`) the new tab and the home page are SOS
// ASCII (Jackson's eye and the time, assets/newtab) and the browser's own frame wears the theme's
// colors with the mono font in the tabs and the address bar (Firefox's dark built-in theme underneath
// a dark theme). Otherwise Firefox as it is. Only defaults: whatever you set in Firefox wins. Read
// once at start; a change shows when Firefox starts again.
// Shipped by svoya-shell (packages/svoya-shell/prepare.sh) as /usr/lib/firefox/sos.cfg.
try {
    const CC = Components.classes, CI = Components.interfaces;
    const env = CC["@mozilla.org/process/environment;1"].getService(CI.nsIEnvironment);
    const home = env.get("HOME");
    const state = env.get("XDG_STATE_HOME") || home + "/.local/state";

    const read = path => {
        const file = CC["@mozilla.org/file/local;1"].createInstance(CI.nsIFile);
        file.initWithPath(path);
        if (!file.exists())
            return "";
        const raw = CC["@mozilla.org/network/file-input-stream;1"].createInstance(CI.nsIFileInputStream);
        raw.init(file, -1, 0, 0);
        const text = CC["@mozilla.org/intl/converter-input-stream;1"].createInstance(CI.nsIConverterInputStream);
        text.init(raw, "UTF-8", 0, 0);
        let out = "";
        const part = {};
        while (text.readString(0xffffffff, part) !== 0)
            out += part.value;
        text.close();
        return out;
    };

    let theme = {}, shell = {};
    try { theme = JSON.parse(read(state + "/svoya/theme.json") || "{}"); } catch (e) { theme = {}; }
    try { shell = JSON.parse(read((env.get("XDG_CONFIG_HOME") || home + "/.config") + "/svoya/shell.json") || "{}"); } catch (e) { shell = {}; }
    const style = shell.asciiStyle || "auto";
    const parts = Array.isArray(shell.asciiParts) ? shell.asciiParts : ["widgets", "folders", "cursor", "browser"];
    const symbols = (style === "always" || (style !== "off" && theme.id === "phosphor")) && parts.indexOf("browser") >= 0;

    if (symbols) {
        // theme.json colors are #AARRGGBB (for QML)
        const rgba = (c, fallback) => {
            const m = /^#([0-9a-f]{2})?([0-9a-f]{6})$/i.exec(String(c || ""));
            if (!m)
                return fallback;
            const a = m[1] ? parseInt(m[1], 16) / 255 : 1, v = parseInt(m[2], 16);
            return `rgba(${v >> 16 & 255}, ${v >> 8 & 255}, ${v & 255}, ${a.toFixed(3)})`;
        };
        const hex6 = (c, fallback) => {
            const m = /^#(?:[0-9a-f]{2})?([0-9a-f]{6})$/i.exec(String(c || ""));
            return m ? m[1] : fallback;
        };
        const dark = theme.mode !== "light";
        // A plain address, no #colors: Firefox counts the page as its new tab only when the address
        // matches exactly, and then leaves the address bar empty instead of showing a file:// URL.
        // The theme's colors reach the page through the style sheet below.
        const page = "file:///usr/share/svoya/shell/assets/newtab/index.html";
        const pageColors = "--fg: #" + hex6(theme.accent, "3cffd0") + " !important; --bg: #" + hex6(theme.wall, dark ? "0a0a0a" : "f2efe8")
            + " !important; --noise: #" + hex6(theme.textFaint, dark ? "5a5a5a" : "8a877f") + " !important;"
            + (dark ? "" : " --alive: #d6246e !important; color-scheme: light !important;");

        defaultPref("browser.startup.homepage", page);
        if (dark)
            defaultPref("extensions.activeThemeID", "firefox-compact-dark@mozilla.org");

        const newTab = () => {
            try {
                const { AboutNewTab } = ChromeUtils.importESModule("resource:///modules/AboutNewTab.sys.mjs");
                AboutNewTab.newTabURL = page;
            } catch (e) {
                Components.utils.reportError("SOS autoconfig, new tab: " + e);
            }
        };
        newTab();
        const obs = CC["@mozilla.org/observer-service;1"].getService(CI.nsIObserverService);
        const once = {
            observe() {
                obs.removeObserver(once, "final-ui-startup");
                newTab();
            }
        };
        obs.addObserver(once, "final-ui-startup");

        const bg = rgba(theme.wall, "rgb(10, 10, 10)"), bar = rgba(theme.surface, "rgb(17, 19, 18)");
        const field = rgba(theme.surface2, "rgb(22, 25, 24)"), hover = rgba(theme.surface3, "rgb(30, 34, 32)");
        const text = rgba(theme.text, "rgb(206, 255, 240)"), dim = rgba(theme.textDim, "rgb(120, 150, 140)");
        const accent = rgba(theme.accent, "rgb(60, 255, 208)"), line = rgba(theme.lineStrong, "rgba(60, 255, 208, 0.25)");
        const mono = String(theme.mono || "IBM Plex Mono").replace(/"/g, "");
        const css = `@-moz-document url("chrome://browser/content/browser.xhtml") {
  :root {
    --toolbox-bgcolor: ${bg} !important; --toolbox-bgcolor-inactive: ${bg} !important;
    --toolbox-textcolor: ${text} !important; --toolbox-textcolor-inactive: ${dim} !important;
    --lwt-accent-color: ${bg} !important; --lwt-text-color: ${text} !important; --lwt-tab-line-color: ${accent} !important;
    --toolbar-bgcolor: ${bar} !important; --toolbar-color: ${text} !important;
    --toolbar-field-background-color: ${field} !important; --toolbar-field-color: ${text} !important;
    --toolbar-field-border-color: ${line} !important;
    --toolbar-field-focus-background-color: ${field} !important; --toolbar-field-focus-color: ${text} !important;
    --toolbar-field-focus-border-color: ${accent} !important;
    --tab-selected-bgcolor: ${bar} !important; --tab-selected-textcolor: ${text} !important;
    --tab-loading-fill: ${accent} !important; --focus-outline-color: ${accent} !important;
    --arrowpanel-background: ${bar} !important; --arrowpanel-color: ${text} !important; --arrowpanel-border-color: ${line} !important;
    --urlbarView-highlight-background: ${hover} !important; --urlbarView-highlight-color: ${text} !important;
    --chrome-content-separator-color: ${line} !important; --tabpanel-background-color: ${bg} !important;
    --sidebar-background-color: ${bg} !important; --sidebar-text-color: ${text} !important;
  }
  /* the colors themselves, not only the variables: a built-in theme paints images and gradients over them */
  #navigator-toolbox, #titlebar, #TabsToolbar, #toolbar-menubar { background: ${bg} !important; color: ${text} !important; }
  #nav-bar, #PersonalToolbar { background: ${bar} !important; color: ${text} !important; }
  #urlbar-background { background-color: ${field} !important; }
  .tab-label, #urlbar-input, .urlbarView-title, .urlbarView-url, #identity-icon-label, .tab-secondary-label {
    font-family: "${mono}", monospace !important;
  }
  .tab-background:is([selected], [multiselected]) {
    background: ${bar} !important; outline: 1px solid ${line} !important; outline-offset: -1px;
  }
}
@-moz-document url-prefix("${page}") {
  :root { ${pageColors} }
}`;
        const sss = CC["@mozilla.org/content/style-sheet-service;1"].getService(CI.nsIStyleSheetService);
        const io = CC["@mozilla.org/network/io-service;1"].getService(CI.nsIIOService);
        const uri = io.newURI("data:text/css;charset=utf-8," + encodeURIComponent(css));
        if (!sss.sheetRegistered(uri, sss.USER_SHEET))
            sss.loadAndRegisterSheet(uri, sss.USER_SHEET);
    }
} catch (e) {
    Components.utils.reportError("SOS autoconfig: " + e);
}
