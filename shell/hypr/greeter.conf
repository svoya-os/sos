# SOS greeter — Hyprland entry point.  SPDX-License-Identifier: Apache-2.0
# Assumed Hyprland: 0.53.3 (hyprlang), valid up to 0.56.x — see hyprland.conf.
#
# /usr/lib/svoya/greeter-session starts `Hyprland --config /usr/share/svoya/hypr/greeter.conf`.
# The real configuration lives next to the greeter QML (package svoya-shell), so the two change
# together; without it greeter-session falls back to its own minimal config or to agreety.
source = /usr/share/svoya/shell/greeter/hyprland.conf
