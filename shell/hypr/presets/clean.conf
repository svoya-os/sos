# SOS layout preset «Чистый» / Clean.  SPDX-License-Identifier: Apache-2.0
# Assumed Hyprland: 0.53.3 (hyprlang), valid up to 0.56.x — see ../hyprland.conf.
#
# Floating windows with title bars, the bar on top. Sourced by hyprland.conf when
# ~/.config/hypr/svoya-shell.conf says `$svoya_preset = clean` (the default).
#
# Rule names are a contract with the shell (shell/core/Hypr.qml, Super+T): svoya-ws<N> flips the
# default for new windows on workspace N and is switched on with
#   hyprctl keyword 'windowrule[svoya-wsN]:enable true'
# Named rules are applied before anonymous ones and the last match wins, so dialogs that
# hyprland.conf floats stay floating on a tiled workspace.

windowrule {
    name = svoya-float-default
    match:class = .*
    float = on
}

windowrule {
    name = svoya-ws1
    match:workspace = 1
    tile = on
    enable = false
}
windowrule {
    name = svoya-ws2
    match:workspace = 2
    tile = on
    enable = false
}
windowrule {
    name = svoya-ws3
    match:workspace = 3
    tile = on
    enable = false
}
windowrule {
    name = svoya-ws4
    match:workspace = 4
    tile = on
    enable = false
}
windowrule {
    name = svoya-ws5
    match:workspace = 5
    tile = on
    enable = false
}
windowrule {
    name = svoya-ws6
    match:workspace = 6
    tile = on
    enable = false
}
windowrule {
    name = svoya-ws7
    match:workspace = 7
    tile = on
    enable = false
}
windowrule {
    name = svoya-ws8
    match:workspace = 8
    tile = on
    enable = false
}
windowrule {
    name = svoya-ws9
    match:workspace = 9
    tile = on
    enable = false
}
windowrule {
    name = svoya-ws10
    match:workspace = 10
    tile = on
    enable = false
}

general {
    snap {
        enabled = true
        window_gap = 10
        monitor_gap = 12
        respect_gaps = true
    }
}
