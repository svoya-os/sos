# SOS layout preset «Хакер» / Hacker.  SPDX-License-Identifier: Apache-2.0
# Assumed Hyprland: 0.53.3 (hyprlang), valid up to 0.56.x — see ../hyprland.conf.
#
# Tiling (dwindle), no title bars, a 1px accent border on the active window (DESIGN.md §5),
# focus follows the mouse. Sourced when svoya-shell.conf says `$svoya_preset = hacker`.
#
# Same rule names as clean.conf (contract with shell/core/Hypr.qml): here svoya-ws<N> floats new
# windows on workspace N once the shell enables it (Super+T). svoya-float-default exists but stays
# off, so `hyprctl keyword 'windowrule[svoya-float-default]:enable true'` floats everything.

windowrule {
    name = svoya-float-default
    match:class = .*
    float = on
    enable = false
}

windowrule {
    name = svoya-ws1
    match:workspace = 1
    float = on
    enable = false
}
windowrule {
    name = svoya-ws2
    match:workspace = 2
    float = on
    enable = false
}
windowrule {
    name = svoya-ws3
    match:workspace = 3
    float = on
    enable = false
}
windowrule {
    name = svoya-ws4
    match:workspace = 4
    float = on
    enable = false
}
windowrule {
    name = svoya-ws5
    match:workspace = 5
    float = on
    enable = false
}
windowrule {
    name = svoya-ws6
    match:workspace = 6
    float = on
    enable = false
}
windowrule {
    name = svoya-ws7
    match:workspace = 7
    float = on
    enable = false
}
windowrule {
    name = svoya-ws8
    match:workspace = 8
    float = on
    enable = false
}
windowrule {
    name = svoya-ws9
    match:workspace = 9
    float = on
    enable = false
}
windowrule {
    name = svoya-ws10
    match:workspace = 10
    float = on
    enable = false
}

general {
    col.active_border = $svoya_accent
    col.inactive_border = $svoya_line
    gaps_in = 3
    gaps_out = 8
}

input {
    follow_mouse = 1
}

# No title bars (hyprbars may be absent: keep the error bar quiet).
# hyprlang noerror true
plugin {
    hyprbars {
        enabled = false
    }
}
# hyprlang noerror false
