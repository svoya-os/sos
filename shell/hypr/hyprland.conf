# SOS — Hyprland configuration.  SPDX-License-Identifier: Apache-2.0
#
# Installed as /usr/share/svoya/hypr/hyprland.conf (package svoya-session) and started by
# /usr/bin/svoya-session:  start-hyprland -- --config /usr/share/svoya/hypr/hyprland.conf
#
# Assumed Hyprland: 0.53.3 (Ubuntu 26.04 archive, pinned to 0.53.* by svoya-base) with
# hyprland-plugin-hyprbars 0.53.0. Written in hyprlang (the legacy syntax) and checked against the
# 0.53/0.54 wiki and the 0.56.2 source, which still reads hyprlang. Hyprland git after 0.56 is
# Lua-only: moving past 0.56 needs a Lua port of these files (tracked in shell/CHECKLIST.md).
#
# Reading order (later lines win):
#   1. defaults below (variables, look, Graphite colors so a missing theme file is harmless)
#   2. ~/.local/state/svoya/hypr/input.conf   keyboard from /etc/default/keyboard (svoya-session)
#   3. ~/.config/hypr/svoya-shell.conf        written by the SOS Shell: preset, reduce motion, layouts
#   4. ~/.config/hypr/svoya-colors.conf       written by `sos theme apply`: colors, hyprbars buttons
#   5. ./presets/<preset>.conf                clean | classic | hacker
#   6. ./nvidia.conf                          only with the NVIDIA driver (see "NVIDIA" below)
#   7. keybindings (ARCHITECTURE.md §6), window and layer rules, autostart
#   8. ~/.config/hypr/user.conf               yours: anything here overrides everything above
#
# Files that may be missing are sourced between "# hyprlang noerror true/false", which also hides
# errors inside them; user.conf is not, so mistakes there show up in Hyprland's error bar.

# ─── variables ──────────────────────────────────────────────────────────────────────────────────
# Shell actions go through Quickshell IPC to the running SOS Shell. SVOYA_SHELL_DIR (same variable as
# `sos session-start`) points both at a development checkout; /bin/sh expands it, hyprlang does not.
$svoya_ipc = quickshell -p "${SVOYA_SHELL_DIR:-/usr/share/svoya/shell}" ipc call
$svoya_hyprbars = /usr/lib/x86_64-linux-gnu/hyprland/plugins/libhyprbars.so

# Overridden by svoya-shell.conf (the shell's settings) when it exists.
$svoya_preset = clean
$svoya_animations = 1

# Theme tokens (Graphite). svoya-colors.conf redefines them with the active theme.
$svoya_wall = rgb(0c0d0f)
$svoya_surface = rgb(141518)
$svoya_surface3 = rgb(22252a)
$svoya_line = rgb(25282d)
$svoya_lineStrong = rgb(363a41)
$svoya_text = rgb(ebe8e1)
$svoya_textDim = rgb(9d9a92)
$svoya_accent = rgb(ffb547)
$svoya_shadow = rgba(000000b3)
$svoya_font = IBM Plex Sans

# ─── monitors ───────────────────────────────────────────────────────────────────────────────────
# Every output at its preferred mode, placed automatically, scale chosen by Hyprland.
monitor = , preferred, auto, auto

# ─── environment ────────────────────────────────────────────────────────────────────────────────
# svoya-session exports the session variables (Wayland toolkits, XDG_CURRENT_DESKTOP, NVIDIA hints);
# only the cursor lives here.
env = XCURSOR_THEME,Adwaita
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24

# ─── input ──────────────────────────────────────────────────────────────────────────────────────
input {
    # SOS default: English + Russian, Alt+Shift switches. input.conf (next) carries the layout chosen
    # at install time; the shell's own choice (wizard, control center) comes after it.
    kb_layout = us,ru
    kb_options = grp:alt_shift_toggle
    repeat_rate = 30
    repeat_delay = 350
    numlock_by_default = true

    # Click to focus (the pointer still scrolls the window under it): what people expect from a
    # floating desktop. The Hacker preset switches to focus-follows-mouse.
    follow_mouse = 2
    float_switch_override_focus = 0

    touchpad {
        natural_scroll = true
        tap-to-click = true
        disable_while_typing = true
        clickfinger_behavior = true
    }
}

# hyprlang noerror true
source = ~/.local/state/svoya/hypr/input.conf
source = ~/.config/hypr/svoya-shell.conf
# Hyprland's own log (off by default after the config is read): on with the kernel parameter
# sos.debug, written by /usr/bin/svoya-session into ~/.local/state/svoya/hyprland.log
source = ~/.local/state/svoya/hypr/debug.conf
# hyprlang noerror false

# A layout set in the shell (Settings → keyboard, first-run wizard) wins over /etc/default/keyboard.
# hyprlang if svoya_kb_layout
input {
    kb_layout = $svoya_kb_layout
    kb_variant = $svoya_kb_variant
    kb_options = $svoya_kb_options
}
# hyprlang endif

gesture = 3, horizontal, workspace

# ─── look (DESIGN.md §3–5) ──────────────────────────────────────────────────────────────────────
general {
    border_size = 1
    gaps_in = 4                 # per side: 8px between windows
    gaps_out = 12
    col.active_border = $svoya_lineStrong
    col.inactive_border = $svoya_line
    layout = dwindle
    resize_on_border = true
    extend_border_grab_area = 12
    hover_icon_on_border = true
    # A fullscreen game that asks for it (vsync off in its settings) may tear for the lowest latency,
    # as on KDE; nothing tears unless the game asks or has the `immediate` rule (see "games" below).
    allow_tearing = true
}

decoration {
    rounding = 11
    rounding_power = 2.0
    active_opacity = 1.0
    inactive_opacity = 1.0
    dim_inactive = false        # inactive windows keep their colors
    dim_modal = true

    blur {
        enabled = false         # matte: no blur anywhere
    }

    # One soft, large shadow (tokens.css --shadow-soft: 0 28px 60px -24px).
    shadow {
        enabled = true
        range = 30
        render_power = 3
        offset = 0 14
        scale = 0.97
        color = $svoya_shadow
    }
}

# Motion: 120 / 180 / 260 ms, ease-out cubic, no overshoot. SPEED is in deciseconds.
animations {
    enabled = $svoya_animations
}
bezier = svoyaOut, 0.33, 1, 0.68, 1
animation = global, 1, 1.8, svoyaOut
animation = windowsIn, 1, 1.8, svoyaOut, popin 96%
animation = windowsOut, 1, 1.2, svoyaOut, popin 96%
animation = windowsMove, 1, 1.8, svoyaOut
animation = layers, 1, 1.8, svoyaOut, fade
animation = fade, 1, 1.8, svoyaOut
animation = fadeOut, 1, 1.2, svoyaOut
animation = border, 1, 1.2, svoyaOut
animation = borderangle, 0
animation = workspaces, 1, 2.6, svoyaOut, slidefade 8%
animation = specialWorkspace, 1, 1.8, svoyaOut, fade
animation = fadeDpms, 1, 2.6, svoyaOut

dwindle {
    preserve_split = true
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    force_default_wallpaper = 0
    background_color = $svoya_wall
    font_family = $svoya_font
    focus_on_activate = true
    mouse_move_enables_dpms = true
    key_press_enables_dpms = true
    # the SOS Shell may be restarted while the session is locked and take the lock over again
    allow_session_lock_restore = true
    middle_click_paste = true
    # Adaptive sync (FreeSync, G-Sync Compatible) for fullscreen windows only: games and films run
    # without stutter, the desktop keeps a fixed refresh (some panels flicker with VRR everywhere).
    vrr = 2
}

cursor {
    hide_on_key_press = false
}

binds {
    workspace_back_and_forth = false
    drag_threshold = 6
}

ecosystem {
    no_update_news = true
    no_donation_nag = true
}

# ─── theme colors and window title bars ─────────────────────────────────────────────────────────
# svoya-colors.conf sets general/group/shadow/misc colors, the hyprbars colors and the three hyprbars
# buttons (they carry theme colors, so they are defined there and only there).
# hyprlang noerror true
source = ~/.config/hypr/svoya-colors.conf

# hyprbars (DESIGN §5 window decorations): 36px bar, title left in Plex Sans 12.5px (9pt at 96 dpi),
# buttons right with 7px spacing; the window border runs around bar and content together.
plugin = $svoya_hyprbars
plugin {
    hyprbars {
        enabled = true
        bar_height = 36
        bar_text_size = 9
        bar_text_align = left
        bar_title_enabled = true
        bar_buttons_alignment = right
        bar_padding = 14
        bar_button_padding = 7
        bar_part_of_window = true
        bar_precedence_over_border = true
        icon_on_hover = false
        on_double_click = hyprctl dispatch fullscreen 1
    }
}

# Windows that draw their own title bar (client-side decorations) get no second bar.
# Steam draws its own title bar; games (steam_app_<id>, Wine's *.exe, gamescope) must keep their exact size.
windowrule = hyprbars:no_bar on, match:class ^(firefox|org\.mozilla\.firefox|chromium|chromium-browser|google-chrome|brave-browser|org\.gnome\..*|obsidian|code|code-oss|com\.mitchellh\.ghostty|org\.quickshell|sos\..*|steam|steam_app_[0-9]+|gamescope|.+\.exe)$
# hyprlang noerror false

# ─── layout preset (floating/tiling defaults, per-workspace switch) ─────────────────────────────
# Each preset defines the named rules svoya-float-default and svoya-ws1 … svoya-ws10; the shell
# flips one workspace with `hyprctl keyword 'windowrule[svoya-wsN]:enable true'` (Super+T).
# hyprlang noerror true
source = ./presets/$svoya_preset.conf
# hyprlang noerror false

# ─── NVIDIA ─────────────────────────────────────────────────────────────────────────────────────
# /usr/bin/svoya-session exports __GLX_VENDOR_LIBRARY_NAME=nvidia (with LIBVA_DRIVER_NAME and
# NVD_BACKEND) only when /proc/driver/nvidia/version exists, i.e. the proprietary driver is loaded.
# hyprlang evaluates `if` against the environment, so nvidia.conf is read only on NVIDIA machines.
# hyprlang if __GLX_VENDOR_LIBRARY_NAME
source = ./nvidia.conf
# hyprlang endif

# ─── keybindings (ARCHITECTURE.md §6) ───────────────────────────────────────────────────────────
# Super+J: the shell's global shortcut, so it sees press AND release (tap = panel, hold = talk).
bind = SUPER, J, global, svoya:jackson

bind = SUPER, SPACE, exec, $svoya_ipc launcher toggle
bind = SUPER, V, exec, $svoya_ipc clipboard toggle
bind = SUPER SHIFT, S, exec, $svoya_ipc screenshot region
bind = , Print, exec, $svoya_ipc screenshot region
bind = SUPER, K, exec, $svoya_ipc cheatsheet toggle
bind = SUPER, A, exec, $svoya_ipc controlcenter toggle
bind = SUPER SHIFT, Q, exec, $svoya_ipc session toggle
bind = CTRL ALT, DELETE, exec, $svoya_ipc session toggle
bind = SUPER ALT, A, exec, $svoya_ipc system accessibility
bind = SUPER, Z, exec, $svoya_ipc system undo
bind = SUPER, ESCAPE, exec, $svoya_ipc system doctor
bind = SUPER, T, exec, $svoya_ipc layout toggleTiling
# Lock works on the lock screen too (no-op there) and falls back to logind if the shell is gone.
bindl = SUPER, L, exec, $svoya_ipc lock lock || loginctl lock-session

# Terminal and files still open when the shell is not running.
bind = SUPER, RETURN, exec, $svoya_ipc system terminal || xdg-terminal-exec || kitty
bind = SUPER, E, exec, xdg-open ~

bind = SUPER, Q, killactive
bind = SUPER, F, fullscreen, 0
bind = SUPER SHIFT, F, togglefloating
bind = ALT, TAB, cyclenext
bind = ALT, TAB, alterzorder, top

bind = SUPER, LEFT, movefocus, l
bind = SUPER, RIGHT, movefocus, r
bind = SUPER, UP, movefocus, u
bind = SUPER, DOWN, movefocus, d
bind = SUPER SHIFT, LEFT, movewindow, l
bind = SUPER SHIFT, RIGHT, movewindow, r
bind = SUPER SHIFT, UP, movewindow, u
bind = SUPER SHIFT, DOWN, movewindow, d

bind = SUPER, 1, workspace, 1
bind = SUPER, 2, workspace, 2
bind = SUPER, 3, workspace, 3
bind = SUPER, 4, workspace, 4
bind = SUPER, 5, workspace, 5
bind = SUPER, 6, workspace, 6
bind = SUPER, 7, workspace, 7
bind = SUPER, 8, workspace, 8
bind = SUPER, 9, workspace, 9
bind = SUPER, 0, workspace, 10
bind = SUPER SHIFT, 1, movetoworkspace, 1
bind = SUPER SHIFT, 2, movetoworkspace, 2
bind = SUPER SHIFT, 3, movetoworkspace, 3
bind = SUPER SHIFT, 4, movetoworkspace, 4
bind = SUPER SHIFT, 5, movetoworkspace, 5
bind = SUPER SHIFT, 6, movetoworkspace, 6
bind = SUPER SHIFT, 7, movetoworkspace, 7
bind = SUPER SHIFT, 8, movetoworkspace, 8
bind = SUPER SHIFT, 9, movetoworkspace, 9
bind = SUPER SHIFT, 0, movetoworkspace, 10
bind = SUPER, mouse_down, workspace, e+1
bind = SUPER, mouse_up, workspace, e-1

bindm = SUPER, mouse:272, movewindow
bindm = SUPER, mouse:273, resizewindow

# Hardware keys work on the lock screen too; the shell shows the OSD (volume by watching PipeWire,
# brightness when asked).
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = , XF86MonBrightnessUp, exec, brightnessctl -q -c backlight set 5%+ && $svoya_ipc osd brightness
bindel = , XF86MonBrightnessDown, exec, brightnessctl -q -n -c backlight set 5%- && $svoya_ipc osd brightness
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPause, exec, playerctl pause
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPrev, exec, playerctl previous

# ─── window rules (after the preset's named rules, so these win) ────────────────────────────────
windowrule = float on, match:modal true
windowrule = float on, match:class ^(org\.pulseaudio\.pavucontrol|pavucontrol|nm-connection-editor|blueman-manager|org\.gnome\.Calculator|gnome-calculator|xdg-desktop-portal-gtk|hyprland-share-picker|org\.freedesktop\.impl\.portal\.desktop\..*)$
windowrule = float on, match:title ^(Open File|Open Folder|Save File|Save As|Select a File|Choose Files|File Upload|Открыть файл|Сохранить как|Выбор файла)(.*)$

windowrule {
    name = svoya-pip
    match:title = ^(Picture-in-Picture|Картинка в картинке)$
    float = on
    pin = on
    keep_aspect_ratio = on
    size = (monitor_w*0.28) (monitor_h*0.28)
    move = ((monitor_w*0.72)-24) ((monitor_h*0.72)-24)
}

# Games (steam_app_<id> from Steam, *.exe from Wine/Proton/Lutris/Heroic, gamescope, Minecraft,
# RetroArch) float at the size they ask for, also in the tiling preset, and keep the screen awake
# while fullscreen: a gamepad is not keyboard or mouse input, and the lock must not come mid-game.
# Lower latency for one game (tearing), in ~/.config/hypr/user.conf:
#   windowrule = immediate on, match:class ^(steam_app_1245620)$
windowrule {
    name = svoya-games
    match:class = ^(steam_app_[0-9]+|gamescope|.+\.exe|[Mm]inecraft.*|org\.libretro\.RetroArch|com\.libretro\.RetroArch|retroarch)$
    float = on
    idle_inhibit = fullscreen
}

# Our layers animate themselves (QML); Hyprland's layer animation would double them. The slurp
# selection must vanish instantly or the screenshot catches it fading out.
layerrule = no_anim on, match:namespace ^(svoya-.*)$
layerrule = no_anim on, match:namespace ^(selection)$

# ─── autostart ──────────────────────────────────────────────────────────────────────────────────
# sos session-start: theme → jacksond → SOS Shell → first-run wizard (ARCHITECTURE.md §5).
# Without the sos command the shell is started directly, so the desktop still works.
exec-once = sh -c 'command -v sos >/dev/null 2>&1 && exec sos session-start; exec /usr/lib/svoya/shell-run'
# Clipboard history for Super+V (text and images), and a polkit agent for administrator prompts.
exec-once = sh -c 'command -v cliphist >/dev/null 2>&1 && exec wl-paste --type text --watch cliphist store'
exec-once = sh -c 'command -v cliphist >/dev/null 2>&1 && exec wl-paste --type image --watch cliphist store'
exec-once = systemctl --user start hyprpolkitagent.service

# ─── yours ──────────────────────────────────────────────────────────────────────────────────────
# svoya-session creates this file on first login; it is read last and overrides everything above.
source = ~/.config/hypr/user.conf
