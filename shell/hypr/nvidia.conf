# SOS — Hyprland settings for the NVIDIA proprietary driver.  SPDX-License-Identifier: Apache-2.0
# Assumed Hyprland: 0.53.3 (hyprlang), valid up to 0.56.x — see hyprland.conf.
#
# Read by hyprland.conf only when __GLX_VENDOR_LIBRARY_NAME is set, which /usr/bin/svoya-session
# does only when /proc/driver/nvidia/version exists (the driver is loaded). svoya-session already
# exports LIBVA_DRIVER_NAME=nvidia, __GLX_VENDOR_LIBRARY_NAME=nvidia and NVD_BACKEND=direct for
# the whole session; they are repeated here so programs started by Hyprland get them even when the
# compositor was launched some other way (e.g. `Hyprland --config …` from a TTY with the vars set).
#
# To test the gate on a machine without NVIDIA: __GLX_VENDOR_LIBRARY_NAME=nvidia is enough, and
# `hyprctl getoption cursor:no_hardware_cursors` then prints `set: true` (the values below equal
# Hyprland 0.53.3's defaults, so `int: 2` alone proves nothing; the env lines are the real effect).

env = LIBVA_DRIVER_NAME,nvidia
env = __GLX_VENDOR_LIBRARY_NAME,nvidia
env = NVD_BACKEND,direct
# Electron/Chromium apps: native Wayland, which avoids XWayland flicker on this driver.
env = ELECTRON_OZONE_PLATFORM_HINT,auto

cursor {
    # Hardware cursors through a CPU buffer work on current drivers (Hyprland's "auto" already
    # picks this on NVIDIA; stated explicitly so it survives default changes).
    use_cpu_buffer = 2
    no_hardware_cursors = 2
}

opengl {
    nvidia_anti_flicker = true
}

render {
    # Direct scanout of fullscreen games has caused black frames on this driver; keep it off.
    direct_scanout = 0
}
