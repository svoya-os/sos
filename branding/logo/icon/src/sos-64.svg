<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-label="SOS">
  <title>SOS</title>
  <desc>SOS icon · graphite tile with the mark folded into С / О / С · CC BY-SA 4.0</desc>
  <defs>
