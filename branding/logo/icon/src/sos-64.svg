    <rect x="30" y="20" width="4" height="4" rx="2" fill="#ebe8e1"/>
    <rect x="44.5" y="20" width="4" height="4" rx="2" fill="#ebe8e1"/>
    <rect x="12" y="30" width="11" height="4" rx="2" fill="#ffb547"/>
    <rect x="26.5" y="30" width="11" height="4" rx="2" fill="#ffb547"/>
    <rect x="41" y="30" width="11" height="4" rx="2" fill="#ffb547"/>
    <rect x="15.5" y="40" width="4" height="4" rx="2" fill="#ebe8e1"/>
    <rect x="30" y="40" width="4" height="4" rx="2" fill="#ebe8e1"/>
