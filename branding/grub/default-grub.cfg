# /etc/default/grub.d/90-sos-theme.cfg — the SOS boot menu. Installed by svoya-branding (packaging),
# then `update-grub`. The theme is copied to /boot/grub/themes/svoya so GRUB can read it even when
# the root filesystem is encrypted.
# SPDX-License-Identifier: Apache-2.0
GRUB_DISTRIBUTOR="SOS"
GRUB_THEME="/boot/grub/themes/svoya/theme.txt"      # theme-en.txt for English texts
GRUB_GFXMODE="1920x1080,auto"                          # the theme is drawn for 1080p; other sizes scale the art, not the type
GRUB_GFXPAYLOAD_LINUX="keep"                           # no mode switch between GRUB and Plymouth
GRUB_TERMINAL_OUTPUT="gfxterm"
