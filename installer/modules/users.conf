# SPDX-License-Identifier: Apache-2.0
---
defaultGroups:
    - adm
    - cdrom
    - dip
    - plugdev
    - sudo
    - video
    - render
    - audio
    - name: lpadmin
      must_exist: false
      system: true
    - name: ai          # the shared model store /srv/ai (svoya-base)
      must_exist: true
autologinGroup: autologin
doAutologin: false
setRootPassword: false
doReusePassword: false
passwordRequirements:
    minLength: 6
    maxLength: -1
allowWeakPasswords: true
allowWeakPasswordsDefault: false
user:
    shell: /bin/bash
    forbidden_names: [ root, svoya-greeter ]
hostname:
    location: EtcFile
    writeHostsFile: true
    template: "${login}-sos"
    forbidden_names: [ localhost ]
