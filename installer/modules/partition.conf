# SPDX-License-Identifier: Apache-2.0
# btrfs by default (snapshots, "undo everything"); optional LUKS2. With encryption a small
# unencrypted /boot is added (GRUB cannot unlock LUKS2/argon2id); dracut unlocks the root.
---
efi:
    mountPoint: "/boot/efi"
    recommendedSize: 512MiB
    minimumSize: 300MiB
    label: "EFI"
userSwapChoices:
    - none      # zram (compressed RAM) is always on
    - file      # swap file in the @swap subvolume, e.g. for hibernation
initialSwapChoice: none
luksGeneration: luks2
enableLuksAutomatedPartitioning: true
drawNestedPartitions: true
alwaysShowPartitionLabels: true
initialPartitioningChoice: none
defaultFileSystemType: "btrfs"
availableFileSystemTypes: ["btrfs", "ext4", "xfs"]
lvm:
    enable: true
essentialMounts: [ "live-*", "control", "ventoy" ]
partitionLayout:
    - name: "sos_boot"
      filesystem: ext4
      noEncrypt: true
      onlyPresentWithEncryption: true   # Ubuntu's Calamares; upstream ignores it (then /boot is always separate)
      mountPoint: "/boot"
      size: 2G
    - name: "sos_root"
      filesystem: unknown
      mountPoint: "/"
      size: 100%
