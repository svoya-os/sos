---
showSupportUrl: true
showKnownIssuesUrl: true
showReleaseNotesUrl: true
showDonateUrl: false
# No connectivity check: the installer works offline and makes no network call by itself.
requirements:
    requiredStorage: 32
    requiredRam: 3.5
    check:
        - storage
        - ram
        - power
        - root
        - screen
    required:
        - storage
        - ram
        - root
