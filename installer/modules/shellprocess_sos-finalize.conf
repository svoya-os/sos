# Snapper, the first-run flag for the wizard, removal of live-only packages, cleanup.
---
dontChroot: true
timeout: 1800
verbose: true
script:
    - "/usr/lib/svoya/installer/finalize.sh ${ROOT}"
i18n:
    name: "Finishing: snapshots, first-run setup, cleanup"
    name[ru]: "Завершение: снимки, первый запуск, уборка"
