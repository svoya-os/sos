# SPDX-License-Identifier: Apache-2.0
# Settings go to /etc/default/grub.d/ (next to svoya-base's 50-svoya.cfg, and read after it, so the
# kernel parameters must match it); dracut is detected, so encrypted roots get rd.luks.uuid=.
# plymouth.nolog: the splash does not redirect the console into itself (image/boot/grub.cfg).
---
overwrite: false
prefer_grub_d: true
keep_distributor: false
kernel_params: [ "quiet", "splash", "plymouth.nolog" ]
