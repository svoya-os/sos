# SPDX-License-Identifier: Apache-2.0
# Flat btrfs layout: every subvolume at the top level, so rolling back @ keeps the history in
# @snapshots, and data that must never be rolled back lives in its own subvolume
# (btrfs snapshots are not recursive): home, logs, caches, containers, models (@ai -> /srv/ai).
---
extraMounts:
    - device: proc
      fs: proc
      mountPoint: /proc
    - device: sys
      fs: sysfs
      mountPoint: /sys
    - device: /dev
      mountPoint: /dev
      options: [ bind ]
    - device: tmpfs
      fs: tmpfs
      mountPoint: /run
    - device: /run/udev
      mountPoint: /run/udev
      options: [ bind ]
    - device: efivarfs
      fs: efivarfs
      mountPoint: /sys/firmware/efi/efivars
      efi: true
    - device: /run/systemd/resolve
      mountPoint: /run/systemd/resolve
      options: [ bind ]

btrfsSubvolumes:
    - mountPoint: /
      subvolume: /@
    - mountPoint: /home
      subvolume: /@home
    - mountPoint: /.snapshots
      subvolume: /@snapshots
    - mountPoint: /var/log
      subvolume: /@var_log
    - mountPoint: /var/cache
      subvolume: /@var_cache
    - mountPoint: /var/lib/containers
      subvolume: /@containers
    - mountPoint: /srv/ai
      subvolume: /@ai

btrfsSwapSubvol: /@swap

mountOptions:
    - filesystem: default
      options: [ defaults ]
    - filesystem: efi
      options: [ defaults, umask=0077 ]
    - filesystem: btrfs
      options: [ defaults, noatime, compress=zstd:1 ]
      ssdOptions: [ discard=async ]
    - filesystem: btrfs_swap
      options: [ defaults, noatime ]
    - filesystem: ext4
      options: [ defaults, noatime ]
