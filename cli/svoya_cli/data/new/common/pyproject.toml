[project]
name = "{{ project.name }}"
version = "0.1.0"
description = "{{ project.description }}"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
{{ deps }}
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/{{ project.package }}"]
{{ torch_sources }}
