# SPDX-License-Identifier: Apache-2.0
# SOS local-model ladder for `sos models suggest` (first-run wizard: one click to install).
# Rules: license-safe (Apache-2.0 / MIT only), good Russian, GGUF for llama.cpp, verified on the Hub.
# Verified 2026-09-25 against the Hugging Face API (repo trees, sizes, licenses, config.json):
#   Qwen3.5 4B/9B/27B/35B-A3B/122B-A10B — Apache-2.0, image-text-to-text, hybrid attention
#   (1 full-attention layer in 4; the others are linear attention with a constant-size state);
#   gpt-oss 20b/120b — Apache-2.0, MoE, sliding-window attention on half of the layers.
#
# arch.* feeds the fit estimator (models/estimate.py): layers, full-attention layers, embedding
# size, heads, KV heads, head dim, vocab. sizes are exact byte counts from the Hub.

