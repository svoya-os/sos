# SPDX-License-Identifier: Apache-2.0
# `sos install <name>` for desktop apps: short names → Flathub IDs (installed per user with
# `flatpak install --user`, so no password is needed and `sos remove <name>` undoes it).
# Modules win over apps with the same name (e.g. `obsidian` → module notes).
# proprietary = true → SOS says so before installing.

[app.telegram]
id = "org.telegram.desktop"
name = "Telegram"
license = "GPL-3.0"
aliases = ["телеграм", "телеграмм"]

