# Svoya model catalog: license facts that drive fit/pull warnings and the default catalog view.
# SPDX-License-Identifier: Apache-2.0 — facts researched 2026-09; always re-check the model card.
#
#   match        lowercase substrings of "<repo>/<file>" that identify the model (first match wins,
#                so specific entries come before families)
#   commercial   true | false | "conditional" (thresholds, revenue caps, use policies)
#   excluded     regions the license does not grant rights in ("EU", "UK", "KR", "US")
#   excluded_multimodal  regions excluded only for the multimodal (vision) variants
#   vram_gb      typical need for the common quantization, if known (≈, for the catalog view)
#   params_b     parameters in billions
#
# Default `svoya models list --catalog` view = models usable commercially in the user's region (EU).

[[model]]
id = "qwen-image-2.1"
name = "Qwen-Image 2.1"
kind = "image"
match = ["qwen-image-2.1", "qwen_image_2.1", "qwen-image-2_1"]
license = "Qwen non-commercial"
commercial = false
note = { en = "Non-commercial license, unlike Qwen-Image (Apache-2.0).", ru = "Некоммерческая лицензия, в отличие от Qwen-Image (Apache-2.0)." }

