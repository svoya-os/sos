# ---------------------------------------------------------------------------------------------------
# Kits: the files one ComfyUI graph loads together, from several repositories. `sos models pull <kit>`
# or `sos install <kit>` downloads them all and refreshes the ComfyUI view; Jackson draws with them
# («нарисуй …»; `j draw`). Files keep their ComfyUI names: the graphs in jackson/draw.py load them so.
#   model    the [[model]] entry whose license and notes apply to the kit
#   files    repo + file; alt = other repositories with the same file, tried in order
#   default  the kit Jackson draws with when nothing else is chosen

[[kit]]
id = "flux2-klein-4b"
model = "flux2-klein-4b"
name = "FLUX.2 [klein] 4B"
kind = "image"
default = true
aliases = ["draw", "drawing", "рисование", "рисовалка", "рисовалку", "flux2-klein", "flux-klein", "klein"]
vram_gb = 8.4
files = [
  { repo = "black-forest-labs/FLUX.2-klein-4b-fp8", file = "flux-2-klein-4b-fp8.safetensors" },
  { repo = "Comfy-Org/flux2-klein-4B", file = "split_files/text_encoders/qwen_3_4b.safetensors", alt = ["Comfy-Org/flux2-klein", "Comfy-Org/vae-text-encorder-for-flux-klein-4b"] },
  { repo = "Comfy-Org/flux2-dev", file = "split_files/vae/flux2-vae.safetensors", alt = ["Comfy-Org/vae-text-encorder-for-flux-klein-4b"] },
]

[[kit]]
id = "qwen-image-2.1"
model = "qwen-image-2.1"
name = "Qwen-Image 2.1"
kind = "image"
aliases = ["qwen-image-2", "qwen-image2", "qwen-image-21"]
vram_gb = 16
files = [
  { repo = "Comfy-Org/Qwen-Image-2.1", file = "diffusion_models/qwen_image_2.1_int8_convrot.safetensors" },
  { repo = "Comfy-Org/Qwen-Image-2.1", file = "text_encoders/qwen3vl_8b_int8_convrot.safetensors" },
  { repo = "Comfy-Org/Qwen-Image-2.1", file = "vae/qwen_image_2.1_vae_bf16.safetensors" },
]
