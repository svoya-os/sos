# SOS live medium boot menu (BIOS and UEFI). SPDX-License-Identifier: Apache-2.0
# Rendered by image/build-iso.sh: @DISK_ID@ @LIVE_USER@ @LIVE_HOSTNAME@ @VERSION@ are substituted.
# UEFI: shim -> Canonical-signed gcdx64 (finds /.disk/info, loads this file); BIOS: eltorito core.

set default=0
set timeout=10
set timeout_style=menu

search --no-floppy --set=root --file /.disk/@DISK_ID@

# VM tests (tests/vm) use the SMBIOS product "sos-vm-test": mirror the menu and kernel log to ttyS0,
# and say on serial how the menu came up (fonts, theme, Secure Boot lockdown).
set sos_extra=""
set sos_vmtest=0
if smbios --type 1 --get-string 5 --set sos_product; then
    if [ "${sos_product}" = "sos-vm-test" ]; then
        set sos_vmtest=1
        serial --unit=0 --speed=115200
        terminal_input --append serial
        terminal_output --append serial
        set sos_extra="console=ttyS0,115200 console=tty1 systemd.show_status=1 systemd.mask=serial-getty@ttyS0.service sos.vmtest=1"
        # tests/vm screenshots the menu before pressing Enter; without KVM (TCG) that takes longer
        # than the normal 10 s countdown.
        set timeout=45
    fi
fi

# A Unicode font and gfxterm so that Russian renders; plain text menus stay ASCII.
# Secure Boot: the signed GRUB is in lockdown and refuses fonts from the disk («prohibited by
# secure boot policy»); only the font bundled in the signed image loads, by name. Then the menu is
# plain gfxterm in the theme's colors — the theme itself needs the Svoya Mono fonts.
if [ "${grub_platform}" = "pc" ]; then
    insmod all_video
fi
set sos_unicode=0
if loadfont /boot/grub/fonts/unicode.pf2; then
    set sos_unicode=1
elif loadfont unicode; then
    set sos_unicode=1
fi
if [ "${sos_unicode}" = "1" ]; then
    if [ "${grub_platform}" = "pc" ]; then
        # BIOS «auto» is often 640×480, where the theme's entries get cut off
        set gfxmode=1920x1080,1600x900,1280x800,1280x720,1024x768,auto
    else
        set gfxmode=auto
    fi
    insmod gfxterm
    terminal_output gfxterm
    if [ "${sos_vmtest}" = "1" ]; then
        terminal_output --append serial        # `terminal_output gfxterm` replaced the list
    fi
fi
insmod png
set sos_fonts=0
if [ "${sos_unicode}" = "1" -a -f /boot/grub/themes/svoya/theme.txt ]; then
    # The theme names the "Svoya Mono" PFF2 fonts (built by svoya-branding from IBM Plex Mono);
    # a theme font must be loaded before the theme, otherwise GRUB falls back to unicode.pf2.
    for sos_font in 14 16 24; do
        if loadfont /boot/grub/themes/svoya/svoya-mono-regular-${sos_font}.pf2; then
            set sos_fonts=1
        fi
    done
    if [ "${sos_fonts}" = "1" ]; then
        set theme=/boot/grub/themes/svoya/theme.txt
    fi
fi
if [ "${sos_vmtest}" = "1" ]; then
    echo "SOS-GRUB platform=${grub_platform} unicode=${sos_unicode} theme-fonts=${sos_fonts} lockdown=${lockdown} gfxmode=${gfxmode}"
fi

# Without the theme: light text on black, a white bar (no amber — DESIGN §11 keeps the accent for
# the live signal only).
set color_normal=light-gray/black
set color_highlight=black/light-gray
set menu_color_normal=light-gray/black
set menu_color_highlight=black/light-gray

# Language of the live session (Language · Язык submenu below).
if [ -z "${sos_lang}" ]; then
    set sos_lang=en
fi
if [ "${sos_lang}" = "ru" ]; then
    set sos_locale=ru_RU.UTF-8
else
    set sos_locale=en_US.UTF-8
fi

# Booted as an ISO file from another GRUB (loopback.cfg): tell casper where the image is.
set sos_loop=""
if [ -n "${iso_path}" ]; then
    set sos_loop="iso-scan/filename=${iso_path}"
fi

function sos_boot {
    set gfxpayload=keep
    linux /casper/vmlinuz boot=casper hostname=@LIVE_HOSTNAME@ username=@LIVE_USER@ locale=${sos_locale} fsck.mode=skip noprompt ${sos_extra} ${sos_loop} $1 $2 $3 $4 ---
    initrd /casper/initrd
}

if [ "${sos_unicode}" = "1" ]; then
    menuentry "SOS @VERSION@  ·  СОС" --id sos-live {
        sos_boot quiet splash
    }
    menuentry "SOS (safe graphics · безопасная графика)" --id sos-safe {
        sos_boot nomodeset quiet splash
    }
    menuentry "SOS — test in RAM · проверка в памяти (toram)" --id sos-toram {
        sos_boot toram quiet splash
    }
    submenu "Language · Язык: ${sos_lang}" --id sos-lang {
        menuentry "English" {
            set sos_lang=en
            export sos_lang
            configfile /boot/grub/grub.cfg
        }
        menuentry "Русский" {
            set sos_lang=ru
            export sos_lang
            configfile /boot/grub/grub.cfg
        }
    }
    if [ "${grub_platform}" = "efi" ]; then
        menuentry "UEFI firmware settings · Настройки UEFI" --id uefi-firmware {
            fwsetup
        }
    fi
    menuentry "Reboot · Перезагрузка" --id reboot {
        reboot
    }
    menuentry "Power off · Выключение" --id poweroff {
        halt
    }
else
    menuentry "SOS @VERSION@" --id sos-live {
        sos_boot quiet splash
    }
    menuentry "SOS (safe graphics)" --id sos-safe {
        sos_boot nomodeset quiet splash
    }
    menuentry "SOS - test in RAM (toram)" --id sos-toram {
        sos_boot toram quiet splash
    }
    submenu "Language: ${sos_lang}" --id sos-lang {
        menuentry "English" {
            set sos_lang=en
            export sos_lang
            configfile /boot/grub/grub.cfg
        }
        menuentry "Russian" {
            set sos_lang=ru
            export sos_lang
            configfile /boot/grub/grub.cfg
        }
    }
    if [ "${grub_platform}" = "efi" ]; then
        menuentry "UEFI firmware settings" --id uefi-firmware {
            fwsetup
        }
    fi
    menuentry "Reboot" --id reboot {
        reboot
    }
    menuentry "Power off" --id poweroff {
        halt
    }
fi
