# svoya:generated — theme «{{ name.ru }}» / {{ name.en }} ({{ id }}). Written by `sos theme apply`; edits are overwritten.
# Include from hyprland.conf:   source = ~/.config/hypr/svoya-colors.conf
# Only colors live here: gaps, layouts and keybindings belong to hyprland.conf / user.conf.

# Tokens as Hyprland variables (use them in layout presets, e.g. the Hacker preset's accent border).
$svoya_wall = rgb({{ color.wall | strip }})
$svoya_bar = rgb({{ color.bar | strip }})
$svoya_surface = rgb({{ color.surface | strip }})
$svoya_surface2 = rgb({{ color.surface2 | strip }})
$svoya_surface3 = rgb({{ color.surface3 | strip }})
$svoya_line = rgb({{ color.line | strip }})
$svoya_lineStrong = rgb({{ color.lineStrong | strip }})
$svoya_text = rgb({{ color.text | strip }})
$svoya_textDim = rgb({{ color.textDim | strip }})
$svoya_textFaint = rgb({{ color.textFaint | strip }})
$svoya_accent = rgb({{ color.accent | strip }})
$svoya_accentSoft = rgba({{ color.accentSoft | stripa }})
$svoya_accentInk = rgb({{ color.accentInk | strip }})
$svoya_ok = rgb({{ color.ok | strip }})
$svoya_warn = rgb({{ color.warn | strip }})
$svoya_bad = rgb({{ color.bad | strip }})
$svoya_cloud = rgb({{ color.cloud | strip }})
$svoya_shadow = rgba({{ color.shadow | stripa }})
$svoya_font = {{ font.sans }}

general {
    # DESIGN §5: border 1px `line`; the active window gets `lineStrong` (inactive windows are not dimmed)
    col.active_border = rgb({{ color.lineStrong | strip }})
    col.inactive_border = rgb({{ color.line | strip }})
    col.nogroup_border = rgb({{ color.line | strip }})
    col.nogroup_border_active = rgb({{ color.lineStrong | strip }})
}

group {
    col.border_active = rgb({{ color.accent | strip }})
    col.border_inactive = rgb({{ color.line | strip }})
    col.border_locked_active = rgb({{ color.accent | strip }})
    col.border_locked_inactive = rgb({{ color.lineStrong | strip }})

    groupbar {
        col.active = rgb({{ color.surface3 | strip }})
        col.inactive = rgb({{ color.surface2 | strip }})
        col.locked_active = rgb({{ color.accent | strip }})
        col.locked_inactive = rgb({{ color.surface2 | strip }})
        text_color = rgb({{ color.text | strip }})
    }
}

decoration {
    shadow {
        color = rgba({{ color.shadow | stripa }})
        color_inactive = rgba({{ color.shadow | opacity(0.45) | stripa }})
    }
}

misc {
    background_color = rgb({{ color.wall | strip }})
}

plugin {
    hyprbars {
        # DESIGN §5 window decorations: 36px bar in `surface`, Plex Sans title; geometry lives in hyprland.conf
        bar_color = rgb({{ color.surface | strip }})
        col.text = rgb({{ color.text | strip }})
        bar_text_font = {{ font.sans }}

        # Buttons carry theme colors, so they are defined here (and only here): 14px circles in
        # `surface3`, glyphs in `textDim`. Added right-to-left: close, maximize, minimize.
        hyprbars-button = rgb({{ color.surface3 | strip }}), 14, ×, hyprctl dispatch killactive, rgb({{ color.textDim | strip }})
        hyprbars-button = rgb({{ color.surface3 | strip }}), 14, □, hyprctl dispatch fullscreen 1, rgb({{ color.textDim | strip }})
        hyprbars-button = rgb({{ color.surface3 | strip }}), 14, –, hyprctl dispatch movetoworkspacesilent special:minimized, rgb({{ color.textDim | strip }})
    }
}
