# svoya:generated — theme «{{ name.ru }}» / {{ name.en }} ({{ id }}). Written by `sos theme` (apply · accent); edits are overwritten.
# Your own settings: keep them in fuzzel.ini.pre-svoya (included below when it exists) — our colors win.

font={{ font.sans }}:size=10.5
prompt="› "
icon-theme={{ icons }}
width=48
lines=10
horizontal-pad=18
vertical-pad=14
inner-pad=8

[colors]
background={{ color.surface2 | stripa }}
text={{ color.text | stripa }}
prompt={{ color.accent | stripa }}
placeholder={{ color.textFaint | stripa }}
input={{ color.text | stripa }}
match={{ color.accent | stripa }}
selection={{ color.surface3 | stripa }}
selection-text={{ color.text | stripa }}
selection-match={{ color.accent | stripa }}
counter={{ color.textFaint | stripa }}
border={{ color.lineStrong | stripa }}

[border]
width={{ shape.border }}
radius={{ shape.radiusLarge }}
