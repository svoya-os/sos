# svoya:generated — theme «{{ name.ru }}» / {{ name.en }} ({{ id }}). Written by `sos theme apply`; edits are overwritten.
# Your own settings: keep them in kitty.conf.pre-svoya (included below when it exists) — our colors win.

font_family      {{ font.mono }}
bold_font        auto
italic_font      auto
font_size        10.5
modify_font      cell_height 125%
disable_ligatures always
window_padding_width 10 14
cursor_shape     block
cursor_blink_interval 0
enable_audio_bell no
confirm_os_window_close 0

foreground              {{ color.text | hex }}
background              {{ color.surface | hex }}
selection_foreground    {{ color.text | hex }}
selection_background    {{ color.accentSoft | over(color.surface) | mix(color.accent, 0.12) | hex }}
cursor                  {{ color.text | hex }}
cursor_text_color       {{ color.surface | hex }}
url_color               {{ color.cloud | hex }}
url_style               single

active_border_color     {{ color.lineStrong | hex }}
inactive_border_color   {{ color.line | hex }}
bell_border_color       {{ color.warn | hex }}

tab_bar_style           separator
tab_separator           " · "
active_tab_foreground   {{ color.text | hex }}
active_tab_background   {{ color.surface3 | hex }}
inactive_tab_foreground {{ color.textDim | hex }}
inactive_tab_background {{ color.surface | hex }}
tab_bar_background      {{ color.surface | hex }}

mark1_foreground {{ color.accentInk | hex }}
mark1_background {{ color.accent | hex }}
mark2_foreground {{ color.surface | hex }}
mark2_background {{ color.cloud | hex }}

# 16 ANSI colors (derived: semantic tokens + cloud rotated to blue/magenta)
color0  {{ term.c0 | hex }}
color8  {{ term.c8 | hex }}
color1  {{ term.c1 | hex }}
color9  {{ term.c9 | hex }}
color2  {{ term.c2 | hex }}
color10 {{ term.c10 | hex }}
color3  {{ term.c3 | hex }}
color11 {{ term.c11 | hex }}
color4  {{ term.c4 | hex }}
color12 {{ term.c12 | hex }}
color5  {{ term.c5 | hex }}
color13 {{ term.c13 | hex }}
color6  {{ term.c6 | hex }}
color14 {{ term.c14 | hex }}
color7  {{ term.c7 | hex }}
color15 {{ term.c15 | hex }}
