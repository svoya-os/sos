<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>SOS — greeter (login)</title>
<link rel="stylesheet" href="fonts.css">
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="desktop.css">
<link rel="stylesheet" href="components.css">
<script src="shell.js"></script>
<style>
  .hero { top: 180px; }

  .users { display: flex; gap: 16px; margin-top: 52px; }
  .user { width: 176px; display: flex; flex-direction: column; align-items: center; text-align: center; }
  .user .avatar { width: 56px; height: 56px; font-size: 20px; }
  .user .avatar svg.i { width: 24px; height: 24px; stroke-width: 1.5; color: var(--text-dim); }
  .user.on .avatar { box-shadow: inset 0 0 0 1px var(--line-strong), 0 0 0 3px var(--wall), 0 0 0 5px var(--accent); }
  .user .n { margin-top: 14px; font: 500 14px/18px "Plex Sans"; color: var(--text); }
  .user .m { margin-top: 3px; font: 400 11px/16px "Plex Mono"; color: var(--text-faint); }
  .user:not(.on) .avatar { opacity: 0.72; }
  .user:not(.on) .n { color: var(--text-dim); font-weight: 400; }

  .pw { margin-top: 26px; }
  .field .ph { font-size: 14px; }

  .top-left { position: absolute; left: 24px; top: 18px; z-index: 4; }

  .sess { display: flex; align-items: center; gap: 14px; }
  .sess .lbl { font: 400 11px/1 "Plex Mono"; letter-spacing: 0.14em; text-transform: uppercase; color: var(--text-faint); }
  .opt { display: inline-flex; align-items: center; gap: 7px; height: 26px; padding: 0 10px; border-radius: 7px; font: 400 11.5px/1 "Plex Mono"; color: var(--text-dim); }
  .opt.on { color: var(--text); background: var(--surface-2); box-shadow: inset 0 0 0 1px var(--line-strong); }
  .opt svg.i { width: 13px; height: 13px; stroke-width: 1.8; }
  .right { display: flex; align-items: center; gap: 18px; }
  .lang { display: flex; gap: 2px; }
  .pwr { display: flex; gap: 8px; }
  .pwr span {
    width: 32px; height: 32px; border-radius: 9px; display: grid; place-items: center; color: var(--text-dim);
    background: var(--surface-2); box-shadow: inset 0 0 0 1px var(--line-strong);
  }
  .pwr svg.i { width: 15px; height: 15px; stroke-width: 1.7; }
  .foot-row { align-items: center; bottom: 20px; }
  .foot-row .mid { bottom: auto; top: 50%; transform: translate(-50%, -50%); }
</style>
</head>
<body>
<div class="screen">

  <div class="wallpaper">
    <svg class="signal"></svg>
    <div class="grain"></div>
  </div>

  <div class="top-left tbtn"><svg data-i="monitor"></svg>maxim-4090<span class="sep">·</span>SOS 26.10</div>
  <div class="corner">
    <span class="g"><svg data-i="wifi"></svg>Дом-5G</span>
    <span class="g"><svg data-i="battery"></svg>82%</span>
  </div>

  <div class="hero">
    <div class="clock">09<i>:</i>14</div>
    <div class="date">четверг · 24 сентября</div>

    <div class="users">
      <div class="user on">
        <span class="avatar">М</span>
        <div class="n">Максим</div>
        <div class="m">вход вчера в 23:40</div>
      </div>
      <div class="user">
        <span class="avatar"><svg data-i="user"></svg></span>
        <div class="n">Гость</div>
        <div class="m">без пароля · всё стирается</div>
      </div>
    </div>

    <div class="pw">
      <div class="field focus">
        <span class="caret" style="margin:0 -9px 0 -1px"></span><span class="ph">Пароль</span>
        <span class="go"><svg data-i="arrowRight"></svg></span>
      </div>
    </div>
    <div class="under"><span class="hint"><kbd>Tab</kbd>другой пользователь</span><span class="sep">·</span><span class="hint"><kbd>Super</kbd><kbd>Alt</kbd><kbd>A</kbd>спец. возможности</span></div>
  </div>

  <div class="foot-row">
    <div class="sess">
      <span class="lbl">Сессия</span>
      <span class="opt on"><svg data-i="windows"></svg>SOS</span>
      <span class="opt"><svg data-i="tiles"></svg>SOS (тайлинг)</span>
    </div>
    <span class="mid"><svg class="morse" data-s="1.5"></svg></span>
    <div class="right">
      <div class="lang"><span class="opt on">RU</span><span class="opt">EN</span></div>
      <div class="pwr">
        <span title="Сон"><svg data-i="moon"></svg></span>
        <span title="Перезагрузка"><svg data-i="restart"></svg></span>
        <span title="Выключение"><svg data-i="power"></svg></span>
      </div>
    </div>
  </div>

</div>
<script>
  SOS.init({ bar: false });
</script>
</body>
</html>
