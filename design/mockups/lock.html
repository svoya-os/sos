<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Svoya OS — lock screen</title>
<link rel="stylesheet" href="fonts.css">
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="desktop.css">
<link rel="stylesheet" href="components.css">
<script src="shell.js"></script>
<style>
  .hero { top: 226px; }
  .who-row { margin-top: 56px; }
  .pw { margin-top: 22px; }
  .under .dot { width: 5px; height: 5px; }
</style>
</head>
<body>
<div class="screen">

  <div class="wallpaper">
    <svg class="signal"></svg>
    <div class="grain"></div>
  </div>

  <div class="corner">
    <span class="g">RU</span>
    <span class="g"><svg data-i="wifi"></svg></span>
    <span class="g"><svg data-i="battery"></svg>82%</span>
  </div>

  <div class="hero">
    <div class="clock">18<i>:</i>42</div>
    <div class="date">четверг · 24 сентября</div>

    <div class="who-row">
      <span class="avatar">М</span>
      <span class="name">Максим</span>
    </div>
    <div class="pw">
      <div class="field focus">
        <span class="dots"><i></i><i></i><i></i><i></i><i></i></span><span class="caret"></span>
        <span class="go"><svg data-i="arrowRight"></svg></span>
      </div>
    </div>
    <div class="under"><span class="dot"></span>пока тебя нет: обучение <b>62%</b> · ещё 18 мин</div>
  </div>

  <div class="foot-row">
    <span class="tbtn"><svg data-i="accessibility"></svg>спец. возможности</span>
    <span class="mid"><svg class="morse" data-s="1.5"></svg></span>
    <div class="colophon"><b>Svoya OS</b> 26.10 · первый сигнал</div>
  </div>

</div>
<script>
  Svoya.init({ bar: false });
</script>
</body>
</html>
