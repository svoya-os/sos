# SOS portal backends for XDG_CURRENT_DESKTOP=Hyprland. /etc/xdg wins over the file that
# xdg-desktop-portal-hyprland ships in /usr/share: files and settings come from GTK, secrets from
# the GNOME keyring (the Hyprland portal implements neither).
[preferred]
default=hyprland;gtk
org.freedesktop.impl.portal.FileChooser=gtk
org.freedesktop.impl.portal.Settings=gtk
org.freedesktop.impl.portal.Secret=gnome-keyring
