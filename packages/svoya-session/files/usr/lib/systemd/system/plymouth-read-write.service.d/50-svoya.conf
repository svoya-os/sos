# SOS: this unit runs before sysinit.target, so the whole boot waits for it, and a oneshot unit has
# no start timeout of its own. Every boot of a test VM that stopped for good (about 1 in 10-20, all
# CPUs idle) stood right here: plymouthd blocked in a tty read, its client `plymouth update-root-fs`
# waiting for an answer, nothing started after the journal, udev, resolved and oomd. After 15 s the
# boot goes on; greetd's ExecStartPre ends a daemon that is still stuck (/usr/lib/svoya/plymouth-release).
# A normal boot is done here in milliseconds.
[Service]
TimeoutStartSec=15s
