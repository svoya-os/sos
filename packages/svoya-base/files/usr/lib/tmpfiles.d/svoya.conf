# SOS directories (svoya-base).
# /srv/ai: shared model & dataset store (HF_HOME). setgid group "ai" plus default ACLs, so files
# pulled by one member (or by `sos models pull`) stay writable for every member.
d  /srv/ai      2775 root ai - -
d  /srv/ai/hub  2775 root ai - -
a+ /srv/ai      -    -    -  - group:ai:rwx,default:group:ai:rwx,mask::rwx,default:mask::rwx
a+ /srv/ai/hub  -    -    -  - group:ai:rwx,default:group:ai:rwx,mask::rwx,default:mask::rwx
d  /var/lib/svoya 0755 root root - -
d  /etc/svoya     0755 root root - -
