# SOS kernel tuning (svoya-base). SPDX-License-Identifier: Apache-2.0
# Swap goes to compressed RAM (zram, see /usr/lib/systemd/zram-generator.conf.d/60-svoya.conf),
# which is far cheaper than dropping page cache; values as used by Fedora and Pop!_OS for zram.
vm.swappiness = 180
vm.watermark_boost_factor = 0
vm.watermark_scale_factor = 125
vm.page-cluster = 0
# Large models are mmap()ed in many regions (llama.cpp, safetensors); games/Proton need this too.
vm.max_map_count = 1048576
# Editors, dev servers and file watchers.
fs.inotify.max_user_watches = 524288
fs.inotify.max_user_instances = 1024
# Start writeback early so saving multi-gigabyte checkpoints does not freeze the desktop.
vm.dirty_background_bytes = 268435456
vm.dirty_bytes = 1073741824
