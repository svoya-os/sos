# SOS boot defaults (svoya-base). The boot theme is set by svoya-branding (90-sos-theme.cfg).
GRUB_DISTRIBUTOR="SOS"
GRUB_CMDLINE_LINUX_DEFAULT="quiet splash"
# Show the menu briefly: snapshot entries ("yesterday's system", grub-btrfs) live there.
GRUB_TIMEOUT_STYLE=menu
GRUB_TIMEOUT=3
GRUB_RECORDFAIL_TIMEOUT=10
# Detect Windows and other systems for dual boot.
GRUB_DISABLE_OS_PROBER=false
