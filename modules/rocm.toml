license_note = { en = "ROCm: MIT/Apache-2.0 components. PyTorch ROCm wheels bring their own runtime per project.", ru = "ROCm — компоненты MIT/Apache-2.0. Колёса PyTorch для ROCm несут свой рантайм в каждом проекте." }
