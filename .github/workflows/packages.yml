# SPDX-License-Identifier: Apache-2.0
# Build every SOS .deb (svoya-*, quickshell, uv, grub-btrfs) in ubuntu:26.04 and publish the flat
# APT repository as the "sos-repo" artifact. Called by iso.yml; also runs when packaging inputs change.
name: Packages

on:
  push:
    branches: [main]
    paths:
      - "packages/**"
      - "shell/**"
      - "jackson/**"
      - "cli/**"
      - "modules/**"
      - "themes/**"
      - "branding/**"
      - "installer/**"
      - "image/config.env"
      - "scripts/lib/**"
      - ".github/workflows/packages.yml"
  pull_request:
    paths:
      - "packages/**"
      - "installer/**"
      - ".github/workflows/packages.yml"
  workflow_dispatch:
  workflow_call:
    outputs:
      artifact:
        description: Name of the artifact with the APT repository
        value: ${{ jobs.build.outputs.artifact }}

permissions: {}

jobs:
  build:
    name: Build .deb packages (ubuntu:26.04)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
    outputs:
      artifact: sos-repo
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # package versions are derived from git describe / commit time

      - name: Inputs of the third-party builds
        id: inputs
        run: |
          # what the pinned builds depend on: their recipes, the helpers, and the archive they are
          # built against (suite, snapshot), not the comments around it in image/config.env: one
          # comment there threw the cache away and sent quickshell to a struggling server (06.11.2026)
          archive=$(grep -E '^: "\$\{(SUITE|ARCH|COMPONENTS|SNAPSHOT|SNAPSHOT_MIRROR):=' image/config.env | sha256sum | cut -c1-16)
          echo "archive=$archive" >>"$GITHUB_OUTPUT"

      - name: Restore third-party builds (pinned, rarely change)
        id: external
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: dist/external-cache
          key: external-v3-${{ hashFiles('packages/versions.env', 'packages/external/**', 'packages/lib/**', 'scripts/lib/**') }}-${{ steps.inputs.outputs.archive }}

      - name: Build
        env:
          SVOYA_REPO_SIGNING_KEY: ${{ secrets.SOS_REPO_SIGNING_KEY }}
        run: |
          set -euo pipefail
          mkdir -p dist/repo/pool
          # Every directory is a package: a hand-kept list once missed upsil, and every ISO built
          # from the cache shipped without it.
          external=$(cd packages/external && ls -d -- */ | tr -d / | paste -sd, -)
          ours=$(cd packages && ls -d -- svoya-*/ | tr -d / | paste -sd, -)
          echo "external: $external · ours: $ours"
          if [ "${{ steps.external.outputs.cache-hit }}" = "true" ]; then
            cp dist/external-cache/*.deb dist/repo/pool/
            missing=""
            for p in ${external//,/ }; do
              compgen -G "dist/repo/pool/${p}_*.deb" >/dev/null || missing="$missing,$p"
            done
            [ -z "$missing" ] || echo "::warning::not in the third-party cache, building: ${missing#,}"
            if [ -z "$missing" ]; then
              # only our own packages (Architecture: all): their build tools may come from the live
              # archive. The snapshot server answered 500/503 and 19 kB/s for hours (06.11.2026), and
              # updates for installed systems must not wait for it. Compiled third-party builds
              # (quickshell against Qt) keep the snapshot, so they match the ISO.
              export SNAPSHOT=none
            fi
            packages/build-all.sh --only "$ours$missing"
          else
            packages/build-all.sh
            mkdir -p dist/external-cache
            for p in ${external//,/ }; do cp dist/repo/pool/"${p}"_*.deb dist/external-cache/; done
          fi
          # the ISO needs every package: fail here, not with a system missing a command
          for p in ${external//,/ } ${ours//,/ }; do
            compgen -G "dist/repo/pool/${p}_*.deb" >/dev/null || { echo "::error::no .deb for $p"; exit 1; }
          done
          ls -la dist/repo/pool
          {
            echo "### SOS packages"
            echo '```'
            (cd dist/repo/pool && ls -1 -- *.deb)
            echo '```'
            if [ -f dist/repo/InRelease ]; then
              echo "Signed: installed systems take these as updates once this build is published."
            else
              echo "Not signed (no SOS_REPO_SIGNING_KEY): images built from these get no update source."
            fi
          } >>"$GITHUB_STEP_SUMMARY"

      - name: Save third-party builds
        if: steps.external.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: dist/external-cache
          key: external-v3-${{ hashFiles('packages/versions.env', 'packages/external/**', 'packages/lib/**', 'scripts/lib/**') }}-${{ steps.inputs.outputs.archive }}

      - name: Upload repository
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sos-repo
          path: dist/repo
          retention-days: 14
          if-no-files-found: error

      # The same packages as a flat, signed repository: iso.yml publishes it with the test build, and
      # installed systems update from there (image/README.md, «Updates»).
      - name: Upload the repository for installed systems (signed builds only)
        if: hashFiles('dist/repo/flat/InRelease') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sos-apt
          path: dist/repo/flat
          retention-days: 14
          if-no-files-found: error
