# SPDX-License-Identifier: Apache-2.0
# Build the SOS ISOs (packages -> ubuntu:26.04 privileged container -> hybrid ISO): the standard
# image, one file under 2 GiB (artifact sos-iso), and the one with the offline NVIDIA driver pool,
# split into < 2 GiB parts (artifact sos-iso-nvidia), with one SHA256SUMS; boot them in QEMU and
# screenshot the milestones; every good build of main becomes the test build on GitHub Releases.
name: ISO

on:
  push:
    branches: [main]
    paths:
      - "image/**"
      - "installer/**"
      - "packages/**"
      - "shell/**"
      - "jackson/**"
      - "cli/**"
      - "branding/**"
      - "themes/**"
      - "modules/**"
      - "tests/vm/**"
      - "scripts/**"
      - ".github/workflows/iso.yml"
      - ".github/workflows/vm-test.yml"
  schedule:
    - cron: "17 3 * * *" # nightly, picks up archive updates of the snapshot pin
  workflow_dispatch:
    inputs:
      nvidia_pool:
        description: "NVIDIA branches for the offline pool ('none' = no pool)"
        required: false
        default: "595-open 580"
      vm_test:
        description: "Boot the ISO in QEMU afterwards"
        type: boolean
        default: true
  workflow_call:
    inputs:
      release:
        type: boolean
        default: false
    outputs:
      artifact:
        description: Name of the standard ISO artifact (one file under 2 GiB)
        value: ${{ jobs.iso.outputs.artifact }}
      artifact_nvidia:
        description: Name of the artifact with the NVIDIA ISO (in parts), when the build has the pool
        value: ${{ jobs.iso.outputs.artifact_nvidia }}

permissions: {}

concurrency:
  group: iso-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  packages:
    uses: ./.github/workflows/packages.yml
    permissions:
      contents: read
    secrets: inherit

  iso:
    name: Build ISO
    needs: packages
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    permissions:
      contents: read
    outputs:
      artifact: sos-iso
      artifact_nvidia: ${{ steps.split.outputs.nvidia == 'true' && 'sos-iso-nvidia' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Free disk space
        id: disk
        run: scripts/ci-free-disk.sh

      - name: Download packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sos-repo
          path: dist/repo

      - name: Build ISO (privileged ubuntu:26.04 container)
        env:
          SVOYA_WORK_DIR: ${{ steps.disk.outputs.work_dir }}
          NVIDIA_BRANCHES: ${{ github.event_name == 'workflow_dispatch' && inputs.nvidia_pool || '595-open 580' }}
        run: |
          set -euo pipefail
          if [ "$NVIDIA_BRANCHES" = none ]; then export NVIDIA_BRANCHES="" POOL_STRICT=0; fi
          image/docker-build.sh
          ls -la dist/iso

      - name: Summary
        run: |
          set -euo pipefail
          python3 - <<'PY' >>"$GITHUB_STEP_SUMMARY"
          import glob, json
          for f in sorted(glob.glob("dist/iso/*.iso.json")):
              info = json.load(open(f))
              kind = ("with the NVIDIA drivers " + ", ".join(info.get("nvidiaBranches") or [])
                      if info.get("variant") == "nvidia" else "standard")
              print(f"### {info['iso']} ({kind})")
              print(f"- ISO: {info['isoBytes'] / 2**30:.2f} GiB (squashfs {info['squashfsBytes'] / 2**30:.2f} GiB, "
                    f"driver pool {info['poolBytes'] / 2**30:.2f} GiB)")
              print(f"- archive snapshot: `{info['snapshot']}`, SOURCE_DATE_EPOCH {info['sourceDateEpoch']}")
          PY

      - name: Split for upload (< 2 GiB per file)
        id: split
        run: |
          set -euo pipefail
          rm -f dist/iso/SHA256SUMS            # one list for both images
          for iso in dist/iso/*.iso; do
              # the standard image stays one file (release assets have to be under 2 GiB): it is the
              # download for almost everyone; the one with the NVIDIA pool comes in parts
              case $iso in *-nvidia.iso) mib=1900 ;; *) mib=2000 ;; esac
              scripts/split-artifact.sh split "$iso" "$mib"
          done
          cat dist/iso/SHA256SUMS
          if [ -n "$(find dist/iso -maxdepth 1 -name '*.iso.part00' ! -name '*-nvidia.iso.part00')" ]; then
              echo "::warning::the standard ISO is over 2000 MiB and comes in parts: it should be one file"
          fi
          if compgen -G 'dist/iso/*-nvidia.iso*' >/dev/null; then nvidia=true; else nvidia=false; fi
          echo "nvidia=$nvidia" >>"$GITHUB_OUTPUT"

      - name: Sign checksums (only when a signing key is configured)
        env:
          SIGNING_KEY: ${{ secrets.SOS_RELEASE_SIGNING_KEY }}
        if: env.SIGNING_KEY != ''
        run: |
          set -euo pipefail
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          install -d -m 0700 "$GNUPGHOME"
          printf '%s\n' "$SIGNING_KEY" | gpg --batch --import
          gpg --batch --yes --armor --detach-sign -o dist/iso/SHA256SUMS.asc dist/iso/SHA256SUMS
          rm -rf "$GNUPGHOME"

      - name: Upload the standard ISO
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sos-iso
          path: |
            dist/iso/*
            !dist/iso/*-nvidia.iso*
          retention-days: ${{ inputs.release && 30 || 7 }}
          compression-level: 0
          if-no-files-found: error

      - name: Upload the ISO with the NVIDIA drivers
        if: steps.split.outputs.nvidia == 'true'    # a build without the pool makes only the standard image
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sos-iso-nvidia
          path: |
            dist/iso/*-nvidia.iso*
            dist/iso/SHA256SUMS*
          retention-days: ${{ inputs.release && 30 || 7 }}
          compression-level: 0
          if-no-files-found: error

  vm-test:
    needs: iso
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.vm_test }}
    uses: ./.github/workflows/vm-test.yml
    permissions:
      contents: write   # publishes screenshots to the ci-screens branch (never to main)
      actions: read
    with:
      artifact: sos-iso

  # The image with the NVIDIA drivers is the same system with a bigger pool: it has to boot too.
  boot-nvidia:
    needs: iso
    if: ${{ github.event_name != 'workflow_dispatch' || (inputs.vm_test && inputs.nvidia_pool != 'none') }}
    uses: ./.github/workflows/vm-test.yml
    permissions:
      contents: write   # publishes screenshots to the ci-screens branch (never to main)
      actions: read
    with:
      artifact: sos-iso-nvidia
      firmwares: '["uefi"]'
      label: nvidia

  # A bot uses the live system like a new user (tests/vm/journeys.json): cheat sheet, search,
  # terminal with sos commands, accent and undo, Jackson, control center, Doctor, lock screen.
  # Screenshots and diagnostics land in ci-screens/runs/<run>/journeys-uefi. Not for releases.
  journeys:
    needs: iso
    if: ${{ !inputs.release && (github.event_name != 'workflow_dispatch' || inputs.vm_test) }}
    uses: ./.github/workflows/vm-test.yml
    permissions:
      contents: write   # publishes screenshots to the ci-screens branch (never to main)
      actions: read
    with:
      artifact: sos-iso
      plan: tests/vm/journeys.json
      firmwares: '["uefi"]'
      label: journeys

  # «Safe graphics» (nomodeset: no GPU driver, simpledrm): the entry the docs give for a black
  # screen, and the software rendering VirtualBox and VMware get (packages/svoya-session gpu-env).
  safe-graphics:
    needs: iso
    if: ${{ !inputs.release && (github.event_name != 'workflow_dispatch' || inputs.vm_test) }}
    uses: ./.github/workflows/vm-test.yml
    permissions:
      contents: write   # publishes screenshots to the ci-screens branch (never to main)
      actions: read
    with:
      artifact: sos-iso
      plan: tests/vm/safe-graphics.json
      firmwares: '["uefi"]'
      label: safe-graphics

  # Jackson with a real local model: `sos install` of the suggested model (llama.cpp comes with it),
  # then questions only a model answers; Jackson starts the server itself (tests/vm/model.json).
  model:
    needs: iso
    if: ${{ !inputs.release && (github.event_name != 'workflow_dispatch' || inputs.vm_test) }}
    uses: ./.github/workflows/vm-test.yml
    permissions:
      contents: write   # publishes screenshots to the ci-screens branch (never to main)
      actions: read
    with:
      artifact: sos-iso
      plan: tests/vm/model.json
      firmwares: '["uefi"]'
      label: model

  # Install to an empty NVMe disk with the real installer, reboot into the installed system,
  # log in through the greeter (tests/vm/install.json).
  install:
    needs: iso
    if: ${{ !inputs.release && (github.event_name != 'workflow_dispatch' || inputs.vm_test) }}
    uses: ./.github/workflows/vm-test.yml
    permissions:
      contents: write   # publishes screenshots to the ci-screens branch (never to main)
      actions: read
    with:
      artifact: sos-iso
      plan: tests/vm/install.json
      firmwares: '["uefi"]'
      label: install

  # Games: `sos install steam` (Steam, 32-bit drivers, GameMode, MangoHud, gamescope), then Steam
  # from the launcher (tests/vm/games.json).
  games:
    needs: iso
    if: ${{ !inputs.release && (github.event_name != 'workflow_dispatch' || inputs.vm_test) }}
    uses: ./.github/workflows/vm-test.yml
    permissions:
      contents: write   # publishes screenshots to the ci-screens branch (never to main)
      actions: read
    with:
      artifact: sos-iso
      plan: tests/vm/games.json
      firmwares: '["uefi"]'
      label: games

  # Voice: `sos install voice`, then a spoken question into a virtual microphone, the answer, the
  # conversation going on by itself and «спасибо, всё» (tests/vm/voice.json); speaker.ogg is what
  # Jackson said.
  voice:
    needs: iso
    if: ${{ !inputs.release && (github.event_name != 'workflow_dispatch' || inputs.vm_test) }}
    uses: ./.github/workflows/vm-test.yml
    permissions:
      contents: write   # publishes screenshots to the ci-screens branch (never to main)
      actions: read
    with:
      artifact: sos-iso
      plan: tests/vm/voice.json
      firmwares: '["uefi"]'
      label: voice

  # Every build of main that boots (both images), installs and passes the journeys bot becomes the
  # test build on GitHub Releases: the pre-release «test», downloadable without a GitHub account, one
  # link that stays. The standard image is one file; the NVIDIA one comes in parts with sos-join.
  publish-test:
    name: Publish the test build
    needs: [iso, vm-test, boot-nvidia, install, journeys, safe-graphics]
    if: ${{ !inputs.release && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'schedule') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    concurrency:
      group: publish-test-build
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the images
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: sos-iso*
          merge-multiple: true
          path: release

      - name: Notes and the join helpers
        env:
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          rm -f release/*.README.txt          # sos-join and the notes say how to join the parts
          cp scripts/release/sos-join.bat scripts/release/sos-join.ps1 scripts/release/sos-join.sh release/
          python3 scripts/release/notes.py release "$SHA" test >"$RUNNER_TEMP/NOTES.md"
          cat "$RUNNER_TEMP/NOTES.md" >>"$GITHUB_STEP_SUMMARY"
          too_big=$(find release -type f -size +2047M)
          if [ -n "$too_big" ]; then echo "::error::assets larger than 2 GiB: $too_big"; exit 1; fi
          ls -la release

      - name: Replace the test build
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          # a nightly build that finishes after a newer push must not replace that push's build
          current=$(gh api "repos/$REPO/git/ref/tags/test" --jq .object.sha 2>/dev/null || true)
          if [ -n "$current" ] && [ "$current" != "$SHA" ] &&
             [ "$(gh api "repos/$REPO/compare/$SHA...$current" --jq .status 2>/dev/null || true)" = ahead ]; then
              echo "::notice::the test build already has a newer commit ($current); leaving it"
              exit 0
          fi
          assets=(release/*.iso release/*.iso.part[0-9][0-9] release/SHA256SUMS* release/sos-join.*)
          # upload next to the current test build first (a draft), then swap: the page is gone for
          # seconds, not for the minutes the upload takes
          gh release delete test-next --repo "$REPO" --yes 2>/dev/null || true
          gh release create test-next --repo "$REPO" --draft --prerelease --target "$SHA" \
            --title "Тестовая сборка · Test build $(date -u +%Y-%m-%d)" \
            --notes-file "$RUNNER_TEMP/NOTES.md" "${assets[@]}"
          gh release delete test --repo "$REPO" --yes --cleanup-tag 2>/dev/null || true
          gh release edit test-next --repo "$REPO" --tag test --target "$SHA" --draft=false --prerelease
          gh release view test --repo "$REPO" --json url,assets --jq '.url, (.assets[] | "\(.name) \(.size)")'
