# SPDX-License-Identifier: Apache-2.0
# Tag vX.Y.Z -> build packages + ISO, boot-test it, publish a GitHub Release with the ISO parts
# (< 2 GiB each), SHA256SUMS (signed when SOS_RELEASE_SIGNING_KEY is configured) and the .debs.
name: Release

on:
  push:
    tags: ["v*"]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/iso.yml
    permissions:
      contents: read
      actions: read
    secrets: inherit
    with:
      release: true

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - name: Download ISO
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sos-iso
          path: release

      - name: Download packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sos-repo
          path: repo

      - name: Collect assets
        run: |
          set -euo pipefail
          cp repo/pool/*.deb release/
          # SHA256SUMS (and SHA256SUMS.asc, signed by iso.yml) cover the ISO; appending to it would
          # break the signature, so the packages get their own list.
          (cd release && sha256sum -- *.deb >SHA256SUMS-packages && ls -la)
          too_big=$(find release -type f -size +2047M)
          if [ -n "$too_big" ]; then echo "::error::assets larger than 2 GiB: $too_big"; exit 1; fi

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          prerelease=()
          case "$TAG" in *-*|v0.*) prerelease=(--prerelease) ;; esac
          gh release create "$TAG" --repo "$REPO" --title "SOS $TAG" --generate-notes \
            --verify-tag "${prerelease[@]}" release/*
