# SPDX-License-Identifier: Apache-2.0
# Tag vX.Y.Z -> build packages + both ISOs, boot-test them, publish a GitHub Release: the standard
# ISO (one file under 2 GiB), the NVIDIA ISO in parts with sos-join (Windows, Linux, macOS),
# SHA256SUMS (signed when SOS_RELEASE_SIGNING_KEY is configured) and the .debs.
name: Release

on:
  push:
    tags: ["v*"]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/iso.yml
    permissions:
      contents: write   # iso.yml's boot tests publish screenshots to the ci-screens branch
      actions: read
    secrets: inherit
    with:
      release: true

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the images
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: sos-iso*
          merge-multiple: true
          path: release

      - name: Download packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sos-repo
          path: repo

      - name: Collect assets
        env:
          SHA: ${{ github.sha }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          rm -f release/*.README.txt          # sos-join and the notes say how to join the parts
          cp scripts/release/sos-join.bat scripts/release/sos-join.ps1 scripts/release/sos-join.sh release/
          python3 scripts/release/notes.py release "$SHA" release "$TAG" >"$RUNNER_TEMP/NOTES.md"
          cp repo/pool/*.deb release/
          # SHA256SUMS (and SHA256SUMS.asc, signed by iso.yml) cover the ISO; appending to it would
          # break the signature, so the packages get their own list.
          (cd release && sha256sum -- *.deb >SHA256SUMS-packages && ls -la)
          too_big=$(find release -type f -size +2047M)
          if [ -n "$too_big" ]; then echo "::error::assets larger than 2 GiB: $too_big"; exit 1; fi

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          prerelease=()
          case "$TAG" in *-*|v0.*) prerelease=(--prerelease) ;; esac
          gh release create "$TAG" --repo "$REPO" --title "SOS $TAG" --notes-file "$RUNNER_TEMP/NOTES.md" \
            --generate-notes --verify-tag "${prerelease[@]}" release/*
