# SPDX-License-Identifier: Apache-2.0
# Voice (v0.2 «Голос») with the real models: the speech runtime as `sos install voice` makes it,
# the models fetched by jackson/voice/setup.py, then svoya-voice listening to spoken phrases from
# a file (tests/voice/check.py) — the transcript must have the expected words — and speaking with
# Supertonic 3 into a file that Jackson's own ears must understand. What he said goes to the
# ci-screens branch (evals/voice-check/<run>/) to be listened to.
name: Voice

on:
  push:
    branches: [main]
    paths:
      - "jackson/jackson/voice/**"
      - "jackson/tests/test_voice_*.py"
      - "modules/voice/**"
      - "modules/voice.toml"
      - "tests/voice/**"
      - ".github/workflows/voice.yml"
  workflow_dispatch:

permissions: {}

concurrency:
  group: voice-${{ github.ref }}
  cancel-in-progress: true

jobs:
  voice:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write   # what Jackson said goes to the ci-screens branch (never to main)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Speech runtime and models (as `sos install voice` makes them)
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq espeak-ng ffmpeg >/dev/null
          python3 -m venv "$RUNNER_TEMP/voice"
          . "$RUNNER_TEMP/voice/bin/activate"
          pip install --quiet numpy "onnxruntime>=1.20" "onnx-asr[hub]>=0.10" huggingface_hub "supertonic==1.3.1"
          PYTHONPATH=jackson python -m jackson.voice.setup --models "$RUNNER_TEMP/models" --engine supertonic
          PYTHONPATH=jackson python -m jackson.voice.setup --models "$RUNNER_TEMP/models" --engine supertonic
          PYTHONPATH=jackson python -m jackson.voice.setup --models "$RUNNER_TEMP/models" --check

      - name: Unit tests with numpy
        run: |
          set -euo pipefail
          . "$RUNNER_TEMP/voice/bin/activate"
          cd jackson && python -m unittest -v tests.test_voice_service tests.test_voice_speech tests.test_voice_stt \
            tests.test_voice_engines

      - name: Listen to phrases, then speak
        run: |
          set -euo pipefail
          . "$RUNNER_TEMP/voice/bin/activate"
          # a natural Russian voice (Vosk TTS) and robotic ones (espeak-ng) for a microphone
          pip install --quiet vosk-tts || true
          python - "$RUNNER_TEMP" <<'PY' || echo "::warning::Vosk TTS did not make the Russian phrases"
          import sys
          from vosk_tts import Model, Synth
          synth = Synth(Model(model_name="vosk-model-tts-ru-0.9-multi"))
          synth.synth("какая сегодня погода", sys.argv[1] + "/ru.wav", speaker_id=2)
          synth.synth("открой браузер", sys.argv[1] + "/ru-short.wav", speaker_id=4)
          PY
          espeak-ng -v ru -s 140 -w "$RUNNER_TEMP/ru-espeak.wav" "открой браузер"
          espeak-ng -v en-us -s 140 -w "$RUNNER_TEMP/en.wav" "what time is it now"
          for f in ru ru-short ru-espeak en; do
            [ -f "$RUNNER_TEMP/$f.wav" ] || continue
            ffmpeg -nostdin -loglevel error -y -i "$RUNNER_TEMP/$f.wav" -ar 16000 -ac 1 -f s16le "$RUNNER_TEMP/$f.raw"
          done
          # Jackson's answers as jacksond sends them: numbers already in words (speech.py)
          python tests/voice/check.py --models "$RUNNER_TEMP/models" --engine supertonic --wav-dir dist/said \
            --phrase "ru:$RUNNER_TEMP/ru.raw:погод" --phrase "ru:$RUNNER_TEMP/ru-short.raw:брауз" \
            --phrase "en:$RUNNER_TEMP/en.raw:time" \
            --phrase "?ru:$RUNNER_TEMP/ru-espeak.raw:брауз" \
            --say "ru:Проверка связи. Всё работает, я на месте.:провер,связ" \
            --say "ru:Сейчас пятнадцать тридцать, на улице плюс двенадцать.:пятнадцать,двенадцать" \
            --say "en:Systems check. Everything works, I am here.:check,everything" \
            | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Publish what Jackson said
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN: ${{ github.run_id }}
        run: |
          set -uo pipefail
          [ -d dist/said ] || exit 0
          out=$(mktemp -d)
          for f in dist/said/*.wav; do
            ffmpeg -nostdin -loglevel error -y -i "$f" -c:a libopus -b:a 48k "$out/$(basename "${f%.wav}").ogg"
          done
          scripts/ci-publish.sh "$out" "evals/voice-check/$RUN" "evals: what Jackson said, voice run $RUN"
