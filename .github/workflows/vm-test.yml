# SPDX-License-Identifier: Apache-2.0
# Boot the SOS ISO in QEMU (KVM) with OVMF (UEFI, UEFI + Secure Boot) and SeaBIOS, take QMP
# screenshots at the milestones (boot menu, boot splash, live desktop, launcher, Jackson) and keep
# the serial log. Called by iso.yml; can also test the ISO of an earlier run.
name: VM test

on:
  workflow_call:
    inputs:
      artifact:
        type: string
        default: sos-iso
      run-id:
        description: "Run that produced the ISO artifact (default: this run)"
        type: string
        default: ""
      plan:
        description: "Test plan (tests/vm/*.json)"
        type: string
        default: tests/vm/plan.json
  workflow_dispatch:
    inputs:
      run-id:
        description: "ID of the ISO workflow run whose sos-iso artifact should be tested"
        required: true
      artifact:
        default: sos-iso
      plan:
        description: "Test plan: tests/vm/plan.json (smoke) or tests/vm/journeys.json (user journeys)"
        default: tests/vm/plan.json

permissions: {}

jobs:
  boot:
    name: Boot (${{ matrix.firmware }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write   # screenshots → ci-screens branch (viewable in the browser); main is never touched
      actions: read
    strategy:
      fail-fast: false
      matrix:
        firmware: [uefi, bios, uefi-sb]
    # Secure Boot depends on the Microsoft keys in the runner's OVMF build (the 2023 UEFI CA may be
    # missing there); it reports, but does not block, until that is verified.
    continue-on-error: ${{ matrix.firmware == 'uefi-sb' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download ISO
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.artifact }}
          path: iso
          run-id: ${{ inputs.run-id || github.run_id }}
          github-token: ${{ github.token }}

      - name: Reassemble and verify
        run: |
          set -euo pipefail
          scripts/split-artifact.sh join iso
          ls -la iso
          isos=(iso/*.iso)
          [ -f "${isos[0]}" ] || { echo "::error::no ISO in the artifact"; exit 1; }
          echo "ISO=${isos[0]}" >>"$GITHUB_ENV"

      - name: Install QEMU and OVMF
        run: |
          set -euo pipefail
          sudo apt-get -o Acquire::Retries=3 update -q
          # noble: qemu-system-x86 Depends on seabios and ipxe-qemu (BIOS, virtio-net ROM); ovmf ships
          # /usr/share/OVMF/OVMF_{CODE,VARS}_4M.fd, OVMF_CODE_4M.secboot.fd and OVMF_VARS_4M.ms.fd.
          sudo apt-get -o Acquire::Retries=3 install -y -q --no-install-recommends \
              qemu-system-x86 qemu-utils ovmf python3-pil
          qemu-system-x86_64 --version | head -n1
          ls /usr/share/OVMF

      - name: Enable KVM
        run: scripts/ci-enable-kvm.sh

      - name: Boot and screenshot
        env:
          PLAN: ${{ inputs.plan || 'tests/vm/plan.json' }}
        run: python3 tests/vm/run.py --iso "$ISO" --plan "$PLAN" --firmware "${{ matrix.firmware }}" --out "dist/vm-${{ matrix.firmware }}"

      - name: Report
        if: always()
        run: |
          dir="dist/vm-${{ matrix.firmware }}"
          cat "$dir/report.md" >>"$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          log="$dir/serial.log"
          [ -f "$log" ] || exit 0
          # milestones, diagnostics blocks and anything that looks like trouble
          echo "::group::serial: SOS marks, diagnostics, errors"
          awk '/SOS-DIAG begin/{d=1} d{print} /SOS-DIAG end/{d=0; next}
               !d && /SOS-MARK|[Ee]rror|ERROR|[Ff]ail|FAIL|[Ww]arn|segfault|core dump|Hyprland|hyprland|quickshell|greetd|svoya|sos-/' "$log" \
            | tr -d '\r' | sed 's/\x1b\[[0-9;?]*[a-zA-Z]//g' | tail -n 600
          echo "::endgroup::"
          echo "::group::serial: last 120 lines"
          tail -n 120 "$log" | tr -d '\r'
          echo "::endgroup::"

      - name: Publish screenshots (ci-screens branch)
        if: always() && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN: ${{ github.run_id }}
          FW: ${{ matrix.firmware }}
        run: |
          set -uo pipefail
          dir="dist/vm-$FW"
          ls "$dir"/screens/*.png >/dev/null 2>&1 || exit 0
          work=$(mktemp -d)
          url="https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"
          if ! git clone -q --depth 1 --branch ci-screens "$url" "$work" 2>/dev/null; then
              git init -q -b ci-screens "$work"
              git -C "$work" remote add origin "$url"
          fi
          dest="$work/runs/$RUN/$FW"
          mkdir -p "$dest"
          cp "$dir"/screens/*.png "$dest"/
          cp "$dir/report.md" "$dest/README.md" 2>/dev/null || true
          git -C "$work" -c user.name="sos-ci" -c user.email="sos-ci@users.noreply.github.com" add -A
          git -C "$work" -c user.name="sos-ci" -c user.email="sos-ci@users.noreply.github.com" \
              commit -q -m "screens: run $RUN ($FW)" || exit 0
          for i in 1 2 3 4 5; do
              git -C "$work" pull -q --rebase origin ci-screens 2>/dev/null || true
              git -C "$work" push -q origin HEAD:ci-screens && break
              sleep $((i * 4))
          done
          {
            echo "### Screenshots ($FW)"
            for f in "$dest"/*.png; do
              n=$(basename "$f")
              echo "![${n}](https://github.com/${REPO}/raw/ci-screens/runs/${RUN}/${FW}/${n})"
            done
          } >>"$GITHUB_STEP_SUMMARY"

      - name: Upload screenshots and logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vm-${{ matrix.firmware }}
          path: |
            dist/vm-${{ matrix.firmware }}/screens
            dist/vm-${{ matrix.firmware }}/serial.log
            dist/vm-${{ matrix.firmware }}/qemu.log
            dist/vm-${{ matrix.firmware }}/qemu-command.txt
            dist/vm-${{ matrix.firmware }}/report.json
            dist/vm-${{ matrix.firmware }}/report.md
          retention-days: 14
          if-no-files-found: warn
