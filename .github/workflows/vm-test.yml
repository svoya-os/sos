# SPDX-License-Identifier: Apache-2.0
# Boot the SOS ISO in QEMU (KVM) with OVMF (UEFI, UEFI + Secure Boot) and SeaBIOS, take QMP
# screenshots at the milestones (boot menu, boot splash, live desktop, launcher, Jackson) and keep
# the serial log. Called by iso.yml; can also test the ISO of an earlier run.
name: VM test

on:
  workflow_call:
    inputs:
      artifact:
        type: string
        default: sos-iso
      run-id:
        description: "Run that produced the ISO artifact (default: this run)"
        type: string
        default: ""
      plan:
        description: "Test plan (tests/vm/*.json)"
        type: string
        default: tests/vm/plan.json
      firmwares:
        description: "Firmwares to boot, as a JSON list"
        type: string
        default: '["uefi", "bios", "uefi-sb"]'
      label:
        description: "Tells runs of one ISO apart (artifact names, ci-screens folders): e.g. journeys"
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      run-id:
        description: "ID of the ISO workflow run whose sos-iso artifact should be tested"
        required: true
      artifact:
        default: sos-iso
      plan:
        description: "Test plan: tests/vm/plan.json (smoke) or tests/vm/journeys.json (user journeys)"
        default: tests/vm/plan.json
      firmwares:
        description: "Firmwares to boot, as a JSON list"
        default: '["uefi", "bios", "uefi-sb"]'
      label:
        description: "Label for artifact names and ci-screens folders (e.g. journeys)"
        default: ""

permissions: {}

jobs:
  boot:
    name: Boot (${{ matrix.firmware }}${{ inputs.label && format(' · {0}', inputs.label) || '' }})
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: write   # screenshots → ci-screens branch (viewable in the browser); main is never touched
      actions: read
    strategy:
      fail-fast: false
      matrix:
        firmware: ${{ fromJSON(inputs.firmwares || '["uefi", "bios", "uefi-sb"]') }}
    # Secure Boot depends on the Microsoft keys in the runner's OVMF build (the 2023 UEFI CA may be
    # missing there); it reports, but does not block, until that is verified.
    continue-on-error: ${{ matrix.firmware == 'uefi-sb' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download ISO
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.artifact }}
          path: iso
          run-id: ${{ inputs.run-id || github.run_id }}
          github-token: ${{ github.token }}

      - name: Reassemble and verify
        run: |
          set -euo pipefail
          scripts/split-artifact.sh join iso
          ls -la iso
          isos=(iso/*.iso)
          [ -f "${isos[0]}" ] || { echo "::error::no ISO in the artifact"; exit 1; }
          echo "ISO=${isos[0]}" >>"$GITHUB_ENV"

      - name: Install QEMU and OVMF
        run: |
          set -euo pipefail
          sudo apt-get -o Acquire::Retries=3 update -q
          # noble: qemu-system-x86 Depends on seabios and ipxe-qemu (BIOS, virtio-net ROM); ovmf ships
          # /usr/share/OVMF/OVMF_{CODE,VARS}_4M.fd, OVMF_CODE_4M.secboot.fd and OVMF_VARS_4M.ms.fd.
          sudo apt-get -o Acquire::Retries=3 install -y -q --no-install-recommends \
              qemu-system-x86 qemu-utils ovmf python3-pil
          qemu-system-x86_64 --version | head -n1
          ls /usr/share/OVMF

      - name: Enable KVM
        run: scripts/ci-enable-kvm.sh

      - name: Boot and screenshot
        env:
          PLAN: ${{ inputs.plan || 'tests/vm/plan.json' }}
        run: python3 tests/vm/run.py --iso "$ISO" --plan "$PLAN" --firmware "${{ matrix.firmware }}" --out "dist/vm-${{ matrix.firmware }}"

      - name: Report
        if: always()
        run: |
          dir="dist/vm-${{ matrix.firmware }}"
          cat "$dir/report.md" >>"$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          log="$dir/serial.log"
          [ -f "$log" ] || exit 0
          # milestones, diagnostics blocks and anything that looks like trouble
          echo "::group::serial: SOS marks, diagnostics, errors"
          awk '/SOS-DIAG begin/{d=1} d{print} /SOS-DIAG end/{d=0; next}
               !d && /SOS-MARK|[Ee]rror|ERROR|[Ff]ail|FAIL|[Ww]arn|segfault|core dump|Hyprland|hyprland|quickshell|greetd|svoya|sos-/' "$log" \
            | tr -d '\r' | sed 's/\x1b\[[0-9;?]*[a-zA-Z]//g' | tail -n 600
          echo "::endgroup::"
          echo "::group::serial: last 120 lines"
          tail -n 120 "$log" | tr -d '\r'
          echo "::endgroup::"

      - name: Publish screenshots and diagnostics (ci-screens branch)
        if: always() && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN: ${{ github.run_id }}
          FW: ${{ matrix.firmware }}
          LABEL: ${{ inputs.label }}
        run: |
          set -uo pipefail
          dir="dist/vm-$FW"
          [ -d "$dir" ] || exit 0
          # everything readable without logging in: screenshots, the step report, the serial
          # diagnostics (SOS-MARK milestones, SOS-GRUB, SOS-DIAG blocks, errors) — also when a run
          # fails before its first screenshot
          sub="$FW"
          [ -n "$LABEL" ] && sub="$LABEL-$FW"
          out=$(mktemp -d)
          cp "$dir"/screens/*.png "$out"/ 2>/dev/null || true
          cp "$dir/report.md" "$out/README.md" 2>/dev/null || true
          cp "$dir/report.json" "$out/report.json" 2>/dev/null || true
          if [ -f "$dir/serial.log" ]; then
              # (llama-server: its requests, slots and prompt progress — what a slow local answer is made of)
              awk '/SOS-DIAG begin/{d=1} d{print} /SOS-DIAG end/{d=0; next}
                   !d && /SOS-MARK|SOS-GRUB|[Ee]rror|ERROR|[Ff]ail|FAIL|[Ww]arn|segfault|core dump|Hyprland|hyprland|quickshell|greetd|svoya|sos-|llama-server.*(srv |slot |spawn|n_ctx )/' \
                  "$dir/serial.log" | tr -d '\r' | sed 's/\x1b\[[0-9;?]*[a-zA-Z]//g' | tail -n 1500 >"$out/diag.txt"
              tail -n 200 "$dir/serial.log" | tr -d '\r' | sed 's/\x1b\[[0-9;?]*[a-zA-Z]//g' >"$out/serial-tail.txt"
          fi
          if [ -s "$dir/speaker.wav" ]; then
              # what the VM said out loud (the voice bot): only the parts that are not silence
              command -v ffmpeg >/dev/null || sudo apt-get install -y -qq ffmpeg >/dev/null
              ffmpeg -nostdin -loglevel error -y -i "$dir/speaker.wav" \
                  -af "silenceremove=start_periods=1:stop_periods=-1:stop_duration=1:stop_threshold=-50dB" \
                  -c:a libopus -b:a 32k "$out/speaker.ogg" || true
          fi
          scripts/ci-publish.sh "$out" "runs/$RUN/$sub" "screens: run $RUN ($sub)"
          {
            echo "### Screenshots ($sub)"
            for f in "$out"/*.png; do
              [ -e "$f" ] || continue
              n=$(basename "$f")
              echo "![${n}](https://github.com/${REPO}/raw/ci-screens/runs/${RUN}/${sub}/${n})"
            done
          } >>"$GITHUB_STEP_SUMMARY"

      - name: Upload screenshots and logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vm-${{ matrix.firmware }}${{ inputs.label && format('-{0}', inputs.label) || '' }}
          path: |
            dist/vm-${{ matrix.firmware }}/screens
            dist/vm-${{ matrix.firmware }}/serial.log
            dist/vm-${{ matrix.firmware }}/qemu.log
            dist/vm-${{ matrix.firmware }}/qemu-command.txt
            dist/vm-${{ matrix.firmware }}/report.json
            dist/vm-${{ matrix.firmware }}/report.md
          retention-days: 14
          if-no-files-found: warn
