# SPDX-License-Identifier: Apache-2.0
# Boot the SOS ISO in QEMU (KVM) with OVMF (UEFI, UEFI + Secure Boot) and SeaBIOS, take QMP
# screenshots at the milestones (boot menu, boot splash, live desktop, launcher, Jackson) and keep
# the serial log. Called by iso.yml; can also test the ISO of an earlier run.
name: VM test

on:
  workflow_call:
    inputs:
      artifact:
        type: string
        default: sos-iso
      run-id:
        description: "Run that produced the ISO artifact (default: this run)"
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      run-id:
        description: "ID of the ISO workflow run whose sos-iso artifact should be tested"
        required: true
      artifact:
        default: sos-iso

permissions: {}

jobs:
  boot:
    name: Boot (${{ matrix.firmware }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        firmware: [uefi, bios, uefi-sb]
    # Secure Boot depends on the Microsoft keys in the runner's OVMF build (the 2023 UEFI CA may be
    # missing there); it reports, but does not block, until that is verified.
    continue-on-error: ${{ matrix.firmware == 'uefi-sb' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download ISO
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.artifact }}
          path: iso
          run-id: ${{ inputs.run-id || github.run_id }}
          github-token: ${{ github.token }}

      - name: Reassemble and verify
        run: |
          set -euo pipefail
          scripts/split-artifact.sh join iso
          ls -la iso
          echo "ISO=$(ls iso/*.iso | head -n1)" >>"$GITHUB_ENV"

      - name: Install QEMU and OVMF
        run: |
          set -euo pipefail
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends qemu-system-x86 qemu-utils ovmf python3-pil
          qemu-system-x86_64 --version | head -n1
          ls /usr/share/OVMF

      - name: Enable KVM
        run: scripts/ci-enable-kvm.sh

      - name: Boot and screenshot
        run: python3 tests/vm/run.py --iso "$ISO" --firmware "${{ matrix.firmware }}" --out "dist/vm-${{ matrix.firmware }}"

      - name: Report
        if: always()
        run: |
          cat "dist/vm-${{ matrix.firmware }}/report.md" >>"$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          tail -n 60 "dist/vm-${{ matrix.firmware }}/serial.log" 2>/dev/null || true

      - name: Upload screenshots and logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vm-${{ matrix.firmware }}
          path: |
            dist/vm-${{ matrix.firmware }}/screens
            dist/vm-${{ matrix.firmware }}/serial.log
            dist/vm-${{ matrix.firmware }}/qemu.log
            dist/vm-${{ matrix.firmware }}/qemu-command.txt
            dist/vm-${{ matrix.firmware }}/report.json
            dist/vm-${{ matrix.firmware }}/report.md
          retention-days: 14
          if-no-files-found: warn
